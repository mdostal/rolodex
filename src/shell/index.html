<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rolodex</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="description" content="Open-source relationship rolodex you run locally: own your contacts in SQLite, sync with Google Contacts, and search or log interactions through a real UI." />
  <meta property="og:title" content="rolodex" />
  <meta property="og:description" content="Open-source relationship rolodex you run locally: own your contacts in SQLite, sync with Google Contacts, and search or log interactions through a real UI." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      color-scheme: light dark;
      --border: #d9d9df;
      --muted: #6b6b76;
      --bg: #fff;
      --fg: #1b1b1f;
      --accent: #2f5ed9;
      --accent-bg: #eef2fd;
      --danger: #b3261e;
      --ok-bg: #e7f6ec;
      --ok-fg: #1e7b34;
      --row-hover: #f4f5f8;
      --chip-bg: #eef0f4;
      --accent-fg: #fff;
    }
    /* Brass theme — colors only, no font changes (kept to the system-font
       stack so this stays a fully local/offline app). Tokens are taken
       verbatim from the app-icon-picker artifact, whose dark half the owner
       specifically liked: a light paper palette here, and a deep-green/
       brass-gold palette under prefers-color-scheme:dark below. This is one
       theme-aware theme, not two separate selectable themes. --accent-fg is
       the one token with no equivalent in that artifact — plain white
       button text fails contrast against the lighter dark-mode gold, so it
       flips to a dark ink there instead. */
    :root[data-theme="brass"] {
      --border: #c7c2ac;
      --muted: #55605a;
      --bg: #e8eae3;
      --fg: #1c2420;
      --accent: #92651e;
      --accent-bg: rgba(146, 101, 30, 0.12);
      --row-hover: #dee1d6;
      --chip-bg: #f4f5ef;
      --accent-fg: #f4f5ef;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="brass"] {
        --border: #3a483e;
        --muted: #a6b0a7;
        --bg: #1a211d;
        --fg: #e9eae3;
        --accent: #d19b4c;
        --accent-bg: rgba(209, 155, 76, 0.16);
        --row-hover: #29342c;
        --chip-bg: #212b24;
        --accent-fg: #1a211d;
      }
      /* .verdict-* are bare text color on the page background, not pills
         with their own background box — their light-mode colors (dark
         green/amber/blue) read fine on a light page but go near-invisible
         against brass dark mode's near-black --bg, so they get lightened
         variants here. --danger/--ok-* (used only inside self-contained
         colored boxes, e.g. the error banner) don't have this problem —
         those boxes carry their own background regardless of page theme. */
      :root[data-theme="brass"] .verdict-strong { color: #3fae62; }
      :root[data-theme="brass"] .verdict-watch { color: #d1a13f; }
      :root[data-theme="brass"] .verdict-referral-only { color: #6f9aef; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      min-width: 960px;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    a { color: var(--accent); }
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
    }
    .topbar .brand { font-weight: 600; font-size: 1rem; }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .back-link, .cancel-link {
      background: none; border: none; color: var(--accent); font: inherit; cursor: pointer;
      padding: 6px 4px; border-radius: 6px;
    }
    .back-link:focus-visible, .cancel-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: var(--accent-fg);
      padding: 8px 14px;
      min-height: 32px;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--fg); }
    button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    button.danger:hover { background: var(--danger); color: #fff; }
    button:disabled { background: #c9c9d1; border-color: #c9c9d1; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 80px; }
    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .page-header h1 { font-size: 1.5rem; margin: 0 0 4px; }
    #count { color: var(--muted); font-size: 0.95rem; }
    .search { position: relative; display: flex; align-items: center; }
    .search input {
      min-width: 240px;
      padding: 8px 32px 8px 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
    }
    .search-icon { position: absolute; left: 8px; opacity: 0.6; font-size: 0.85rem; pointer-events: none; }
    .search-clear {
      position: absolute; right: 2px; min-width: 32px; min-height: 32px; padding: 0;
      background: none; border: none; color: var(--muted); font-size: 1rem; border-radius: 6px; cursor: pointer;
    }
    .search-clear:hover { background: var(--row-hover); }
    #result-summary { color: var(--muted); font-size: 0.9rem; margin: -8px 0 16px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .sync-status { font-size: 0.9rem; color: var(--ok-fg); min-height: 1.2em; margin: 0 0 16px; }
    .sync-status.sync-error { color: var(--danger); }
    .empty-state {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; }
    .empty-state h2 { margin: 0; color: var(--fg); font-size: 1.1rem; }
    .empty-state p { margin: 0 0 8px; max-width: 32ch; }

    /* Contact table */
    table.contacts { width: 100%; border-collapse: collapse; }
    table.contacts th {
      text-align: left; font-size: 0.85rem; color: var(--muted); font-weight: 600;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    table.contacts tbody tr {
      cursor: pointer; min-height: 40px;
    }
    table.contacts tbody tr:hover, table.contacts tbody tr:focus-visible { background: var(--row-hover); }
    table.contacts tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    table.contacts td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.contacts td.next-step { color: var(--muted); }

    .verdict-badge { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .verdict-strong { color: #1e7b34; }
    .verdict-watch { color: #a3720b; }
    .verdict-referral-only { color: #2f5ed9; }
    .verdict-pass { color: var(--muted); }
    .verdict-none { color: var(--muted); }

    /* Detail screen */
    .detail-header h1 { margin: 0 0 2px; font-size: 1.75rem; }
    .detail-header .subordinate { color: var(--muted); margin: 0 0 24px; }
    .detail-columns { display: flex; gap: 40px; align-items: flex-start; }
    .detail-columns .col { flex: 1 1 0; min-width: 0; }
    .detail-columns h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 24px 0 8px; }
    .detail-columns h2:first-of-type { margin-top: 0; }
    .field-row { margin: 0 0 10px; }
    .field-row .label { color: var(--muted); font-size: 0.85rem; margin-right: 6px; }
    .field-row .value { font-size: 1rem; }
    .tag-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-list li {
      background: var(--chip-bg); border-radius: 999px; padding: 3px 10px; font-size: 0.85rem;
    }
    @media (max-width: 800px) {
      .detail-columns { flex-direction: column; }
    }

    /* Verdict segmented control */
    .verdict-picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .verdict-picker [role="radio"] {
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 0.9rem;
      background: transparent; color: var(--fg); cursor: pointer;
    }
    .verdict-picker [role="radio"][aria-checked="true"] {
      background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600;
    }
    .autosave-status {
      font-size: 0.85rem; color: var(--ok-fg); min-height: 1.2em; margin: 0 0 20px;
    }
    .next-step-field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .next-step-field input {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: inherit; font: inherit;
    }
    .interactions-panel {
      margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .interactions-panel .interactions-header {
      display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;
    }
    .interactions-panel h2 { margin: 0; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }

    /* Log-interaction disclosure form */
    .log-interaction-form {
      border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 16px;
    }
    .log-interaction-form fieldset { border: none; padding: 0; margin: 0 0 12px; }
    .log-interaction-form legend { font-size: 0.85rem; color: var(--muted); padding: 0; margin-bottom: 6px; }
    .channel-picker { display: flex; flex-wrap: wrap; gap: 10px; }
    .channel-picker label {
      display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: normal;
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    }
    .channel-picker input[type="radio"]:checked + span,
    .channel-picker label:has(input:checked) { border-color: var(--accent); color: var(--accent); }
    .log-interaction-form .form-field { margin-bottom: 12px; }
    .log-interaction-form .form-field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .log-interaction-form input[type="date"], .log-interaction-form input[type="number"], .log-interaction-form textarea {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: inherit; font: inherit;
    }
    .log-interaction-form textarea { min-height: 64px; resize: vertical; }
    .log-interaction-form .form-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Settings screen (#/settings) — a real page, not a popover; sections
       reuse .log-interaction-form's card look and .settings-section-title
       for headings, same as the popover did. */
    .settings-page { max-width: 640px; }
    .settings-page h1 { margin: 0 0 4px; font-size: 1.4rem; }
    .settings-page .settings-subtitle { margin: 0 0 24px; color: var(--muted); font-size: 0.9rem; }
    .settings-path-value {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.82rem; background: var(--chip-bg); border-radius: 6px;
      padding: 8px 10px; word-break: break-all; margin-bottom: 10px;
    }
    .settings-note {
      margin-top: 10px; font-size: 0.85rem; color: var(--muted);
      background: var(--chip-bg); border-radius: 6px; padding: 8px 10px;
    }
    /* Same look as .theme-toggle/.theme-option (Appearance section), under
       its own class names — wireAppearanceSection() queries .theme-option
       globally (not scoped to its own section), so reusing that class here
       would make its click handler fire on these buttons too. */
    .backend-toggle { display: flex; gap: 8px; }
    .backend-toggle .backend-option { flex: 1; padding: 6px 10px; }
    .backend-toggle .backend-option[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .settings-section-title {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--muted); margin: 0 0 8px;
    }
    .checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
    .theme-toggle { display: flex; gap: 8px; }
    .theme-toggle .theme-option { flex: 1; padding: 6px 10px; }
    .theme-toggle .theme-option[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .icon-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .icon-option {
      padding: 4px; background: transparent; border: 2px solid transparent; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; min-height: 0;
    }
    .icon-option img { display: block; border-radius: 4px; }
    .icon-option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
    /* Reconnect Google status line — mirrors wizard.html's own
       .status-line/.spinner pattern (same UX, adapted to fit inline in a
       popover section instead of a full wizard step). */
    .status-line { font-size: 0.88rem; display: flex; align-items: center; gap: 8px; min-height: 1.2em; }
    .status-line.error { color: var(--danger); }
    .status-line.success { color: var(--ok-fg); }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border);
      border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: 0 0 auto;
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: var(--border); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast/notification component — a single #toast-region living outside
       #content (static markup, not router-managed) so it survives every
       navigation. Transient one-off events only; standing state stays in
       its own inline .status-line — see the ui-feedback-states epic's
       design discussion for the full toast-vs-inline split. */
    #toast-region {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      display: flex; flex-direction: column-reverse; gap: 10px;
      width: 320px; max-width: calc(100vw - 40px); pointer-events: none;
    }
    .toast {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      animation: toast-in 0.18s ease-out; pointer-events: auto;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .toast { animation: none; }
    }
    .toast .toast-icon { flex: 0 0 auto; font-size: 1rem; line-height: 1.3; }
    .toast.success { border-left: 3px solid var(--ok-fg); }
    .toast.success .toast-icon { color: var(--ok-fg); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast.info { border-left: 3px solid var(--accent); }
    .toast.info .toast-icon { color: var(--accent); }
    .toast .toast-body { flex: 1 1 auto; font-size: 0.88rem; line-height: 1.4; }
    .toast .toast-close {
      all: unset; cursor: pointer; color: var(--muted); font-size: 0.85rem; line-height: 1;
      padding: 2px; flex: 0 0 auto;
    }
    .toast .toast-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* Interaction history */
    .interaction-history { list-style: none; margin: 0; padding: 0; }
    .interaction-row {
      display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .interaction-row:last-child { border-bottom: none; }
    .channel-badge {
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 0.85rem;
      color: var(--muted); flex: 0 0 auto; min-width: 90px;
    }
    .interaction-row .interaction-body { flex: 1 1 auto; min-width: 0; }
    .interaction-row .interaction-date { font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
    .interaction-row .interaction-note { white-space: pre-wrap; word-break: break-word; }
    .show-more-link {
      background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 8px 0 0;
    }
    .empty-history {
      color: var(--muted); font-size: 0.9rem; padding: 8px 0;
    }
    .not-found-banner {
      background: #fdecea; color: var(--danger); border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
    }

    /* Form */
    form.contact-form fieldset {
      border: none; padding: 0; margin: 0 0 28px;
    }
    form.contact-form legend {
      font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted);
      padding: 0; margin-bottom: 12px; width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 0.9rem; }
    .form-field .required { color: var(--danger); }
    .form-field input, .form-field textarea {
      padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: inherit; font: inherit;
    }
    .form-field textarea { min-height: 72px; resize: vertical; }
    .form-field.invalid input { border-color: var(--danger); }
    .field-error { color: var(--danger); font-size: 0.85rem; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 12px; }
    .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: normal; }
    .chip-input-wrap {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 6px;
    }
    .chip-input-wrap input {
      border: none; flex: 1 1 120px; min-width: 120px; padding: 4px; background: transparent; color: inherit; font: inherit;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; background: var(--chip-bg); border-radius: 999px;
      padding: 3px 6px 3px 10px; font-size: 0.85rem;
    }
    .chip button {
      all: unset; cursor: pointer; padding: 0 4px; color: var(--muted); font-size: 0.85rem; min-height: auto;
    }
    .chip button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .form-error-banner {
      background: #fdecea; color: var(--danger); border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
    }
    .form-footer {
      /* Deliberately NOT position: sticky/fixed. The page itself is the only
         scroll container (there's no independent scroll pane for #content),
         so a sticky-to-viewport footer here reserves its own space at the
         very end of the form flow *and* simultaneously pins itself over the
         bottom `footerHeight` px of the viewport while "stuck". Those two
         facts combine badly: whatever field happens to fall in that bottom
         strip — which for this form is the Classification/Next-step section
         on a typical viewport — renders directly underneath the footer's
         hit-testable (and visually opaque) box, well before the user has
         scrolled anywhere near the true bottom of the page. No amount of
         extra padding/margin between the fields and the footer fixes this:
         the sticky-stuck screen position is fixed by viewport height minus
         footer height, not by document content, so the overlap band never
         moves. A plain static footer (matching the non-sticky verdict picker
         on the Contact Detail screen) can never overlap the fields above it,
         at any scroll position or viewport size — it simply sits after them
         in normal flow. */
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 14px 0; margin-top: 12px; display: flex; justify-content: flex-end; gap: 10px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left" id="topbar-left">
      <span class="brand">rolodex</span>
    </div>
    <div class="topbar-right" id="topbar-right">
      <button id="add-top">+ Add contact</button>
    </div>
  </header>

  <main id="main">
    <div id="content"></div>
  </main>

  <div id="toast-region" role="region" aria-label="Notifications"></div>

  <script>
    "use strict";

    // ---- tiny fetch helpers -------------------------------------------------
    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) {
        let msg = "request failed: " + res.status;
        try {
          const body = await res.json();
          if (body && body.error) msg = body.error;
        } catch {}
        throw new Error(msg);
      }
      if (res.status === 204) return null;
      return res.json();
    }
    const getContacts = () => api("/api/contacts");
    const getContact = (id) => api("/api/contacts/" + encodeURIComponent(id));
    const deleteContact = (id) => api("/api/contacts/" + encodeURIComponent(id), { method: "DELETE" });
    const saveContact = (payload) =>
      api("/api/contacts", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    const patchVerdict = (id, verdict) =>
      api("/api/contacts/" + encodeURIComponent(id) + "/verdict", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ verdict }),
      });
    const patchNextStep = (id, nextStep) =>
      api("/api/contacts/" + encodeURIComponent(id) + "/next-step", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ nextStep }),
      });
    const syncGoogle = () => api("/api/sync/google", { method: "POST" });
    const pushGoogle = () => api("/api/sync/google/push", { method: "POST" });
    const searchContacts = (q) => api("/api/contacts/search?q=" + encodeURIComponent(q));
    const getNeedsFollowUp = () => api("/api/contacts/needs-follow-up");
    const getFollowUpSettings = () => api("/api/settings/follow-up");
    const putFollowUpSettings = (payload) =>
      api("/api/settings/follow-up", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    const getAutostartSettings = () => api("/api/settings/autostart");
    const putAutostartSettings = (payload) =>
      api("/api/settings/autostart", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    const getWizardSummary = () => api("/api/wizard/summary");
    const getDbLocation = () => api("/api/wizard/database");
    const postDbLocation = (dbPath) =>
      api("/api/wizard/database", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ path: dbPath }),
      });
    const postDbLocationReset = () => api("/api/wizard/database/reset", { method: "POST" });
    const getSecretsBackends = () => api("/api/wizard/secrets-backends");
    const postSecretsBackendChoice = (backend) =>
      api("/api/wizard/secrets-backend-choice", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ backend }),
      });
    const getAppearanceSettings = () => api("/api/settings/appearance");
    const putAppearanceSettings = (payload) =>
      api("/api/settings/appearance", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    const getInteractions = (id) => api("/api/contacts/" + encodeURIComponent(id) + "/interactions");
    const postInteraction = (id, payload) =>
      api("/api/contacts/" + encodeURIComponent(id) + "/interactions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });

    // Set by the "Sync now" handler, displayed once by the very next
    // renderList() (the sync handler re-renders the list to pick up any
    // newly-pulled contacts, which would otherwise wipe out an inline status
    // message written into the markup it just replaced).
    let lastSyncMessage = null;

    // ---- shared data ----------------------------------------------------------
    const VERDICTS = [
      { value: "strong", icon: "●", label: "Strong" },
      { value: "watch", icon: "◐", label: "Watch" },
      { value: "referral-only", icon: "◇", label: "Referral only" },
      { value: "pass", icon: "✕", label: "Pass" },
      { value: "none", icon: "○", label: "None" },
    ];
    const verdictMeta = (v) => VERDICTS.find((x) => x.value === v) || VERDICTS[4];

    const CHANNELS = [
      { value: "call", icon: "☎", label: "Call" },
      { value: "email", icon: "✉", label: "Email" },
      { value: "dm", icon: "◆", label: "DM" },
      { value: "meeting", icon: "▦", label: "Meeting" },
      { value: "other", icon: "○", label: "Other" },
    ];
    const channelMeta = (v) => CHANNELS.find((c) => c.value === v) || CHANNELS[4];

    function todayIso() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function formatInteractionDate(at) {
      // `at` may be a bare date (YYYY-MM-DD, the DateField's native format)
      // or a full ISO timestamp. A bare date passed straight to `new Date()`
      // is parsed as UTC midnight, which toLocaleDateString() then renders
      // in the browser's local zone — one day early for any zone behind
      // UTC. Build a local-midnight Date from the parts instead so a
      // DateField value of "2026-08-11" always displays as Aug 11, not the
      // 10th, regardless of timezone. Full timestamps (with a time/zone
      // component) really do denote an absolute instant, so those still go
      // through Date() as-is.
      const bareDate = /^\d{4}-\d{2}-\d{2}$/.exec(at);
      const d = bareDate
        ? new Date(Number(bareDate[0].slice(0, 4)), Number(bareDate[0].slice(5, 7)) - 1, Number(bareDate[0].slice(8, 10)))
        : new Date(at);
      if (isNaN(d.getTime())) return at;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // ---- toast --------------------------------------------------------------
    // Transient one-off events only (sync/push results, delete failure, a
    // save success/failure) — standing state (form validation, "restart to
    // apply" notes, the Google account status line) stays in its own inline
    // .status-line. #toast-region lives in the static body markup, outside
    // #content, so toasts survive every navigation instead of needing a
    // bridge variable like the old lastSyncMessage hack.
    const TOAST_ICON = { success: "✓", error: "⚠", info: "ℹ" };
    const TOAST_DURATION_MS = 4000;
    function showToast(message, kind) {
      const region = document.getElementById("toast-region");
      const el = document.createElement("div");
      el.className = "toast " + kind;
      // role="alert" already implies an assertive live region on its own —
      // an explicit error toast should interrupt regardless of where focus
      // currently is (a delete/save failure). role="status" implies polite,
      // the right default for success/info.
      el.setAttribute("role", kind === "error" ? "alert" : "status");
      el.innerHTML =
        '<span class="toast-icon" aria-hidden="true">' + (TOAST_ICON[kind] || "") + "</span>" +
        '<span class="toast-body"></span>' +
        '<button type="button" class="toast-close" aria-label="Dismiss">&times;</button>';
      // .textContent, not innerHTML — message is arbitrary (often an
      // err.message) and must never be interpreted as markup.
      el.querySelector(".toast-body").textContent = message;
      let timer = null;
      function dismiss() {
        if (timer) clearTimeout(timer);
        el.remove();
      }
      el.querySelector(".toast-close").addEventListener("click", dismiss);
      timer = setTimeout(dismiss, TOAST_DURATION_MS);
      region.appendChild(el);
    }

    // ---- router -----------------------------------------------------------
    function parseRoute() {
      const hash = location.hash.replace(/^#/, "") || "/";
      const segs = hash.split("/").filter(Boolean);
      if (segs.length === 0) return { view: "list" };
      if (segs[0] === "settings") return { view: "settings" };
      if (segs[0] === "new") return { view: "form", mode: "add" };
      if (segs[0] === "contact" && segs[1] && segs[2] === "edit") return { view: "form", mode: "edit", id: decodeURIComponent(segs[1]) };
      if (segs[0] === "contact" && segs[1]) return { view: "detail", id: decodeURIComponent(segs[1]) };
      return { view: "list" };
    }

    function setTopbar({ left, right }) {
      document.getElementById("topbar-left").innerHTML = left;
      document.getElementById("topbar-right").innerHTML = right;
    }

    function navigate(hash) {
      location.hash = hash;
    }

    const content = document.getElementById("content");

    // Each render*() function's own fetches keep running even after the
    // user navigates away (renderSettings() in particular awaits several
    // sequential requests, giving a fast back-click plenty of time to land
    // first) — nothing cancels an in-flight render. Without this counter, a
    // stale render's error handler landing after a newer render already
    // succeeded would clobber the fresh, correct DOM with an error banner
    // (both write to the same shared `content` node). Bumped once per
    // render() call; a render only touches `content` on failure if it's
    // still the most recent one.
    let renderGeneration = 0;
    async function render() {
      const myGeneration = ++renderGeneration;
      const route = parseRoute();
      try {
        if (route.view === "list") await renderList();
        else if (route.view === "detail") await renderDetail(route.id);
        else if (route.view === "form") await renderForm(route.mode, route.id);
        else if (route.view === "settings") await renderSettings();
      } catch (err) {
        if (myGeneration !== renderGeneration) return;
        content.innerHTML = '<p class="not-found-banner">' + escapeHtml(err.message || String(err)) + "</p>";
        console.error(err);
      }
    }

    // ---- List view ----------------------------------------------------------
    async function renderList() {
      setTopbar({
        left: '<span class="brand">rolodex</span>',
        right:
          '<button type="button" class="secondary" id="settings-toggle" aria-label="Settings">&#9881;</button>' +
          '<button id="add-top">+ Add contact</button>',
      });
      content.innerHTML =
        '<div class="page-header">' +
        "<div><h1>Contacts</h1><div id=\"count\" aria-live=\"polite\">Loading…</div></div>" +
        '<div class="header-actions">' +
        '<div class="search">' +
        '<label for="search-input" class="sr-only">Search contacts</label>' +
        '<span class="search-icon" aria-hidden="true">&#128269;</span>' +
        '<input id="search-input" type="search" placeholder="Search name, org, notes, tags…" />' +
        '<button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>' +
        "</div>" +
        '<button type="button" class="secondary" id="followup-toggle" aria-pressed="false">Needs follow-up</button>' +
        '<button type="button" class="secondary" id="sync-now">Sync now</button>' +
        '<button type="button" class="secondary" id="push-google">Push to Google</button>' +
        "</div>" +
        "</div>" +
        '<div id="result-summary" aria-live="polite"></div>' +
        '<div class="sync-status" id="sync-status" aria-live="polite"></div>' +
        '<div id="list-body"></div>';

      document.getElementById("add-top").addEventListener("click", () => navigate("#/new"));
      document.getElementById("settings-toggle").addEventListener("click", () => navigate("#/settings"));

      const syncStatusEl = document.getElementById("sync-status");
      if (lastSyncMessage) {
        syncStatusEl.textContent = lastSyncMessage;
        lastSyncMessage = null;
      }
      document.getElementById("sync-now").addEventListener("click", async () => {
        const btn = document.getElementById("sync-now");
        btn.disabled = true;
        syncStatusEl.className = "sync-status";
        syncStatusEl.textContent = "Syncing with Google Contacts…";
        try {
          const result = await syncGoogle();
          lastSyncMessage =
            "Synced " + result.pulled + " contact" + (result.pulled === 1 ? "" : "s") +
            " from Google (" + result.created + " new, " + result.updated + " updated).";
          await renderList();
        } catch (err) {
          syncStatusEl.className = "sync-status sync-error";
          syncStatusEl.textContent = "Sync failed: " + err.message;
          btn.disabled = false;
        }
      });
      document.getElementById("push-google").addEventListener("click", async () => {
        // Push is the more consequential direction — it creates/overwrites
        // data on the owner's real Google account — so it gets its own
        // confirmation, unlike the non-destructive "Sync now" pull.
        if (!confirm("Push every local contact to Google Contacts? This may create or overwrite contacts there.")) return;
        const btn = document.getElementById("push-google");
        btn.disabled = true;
        syncStatusEl.className = "sync-status";
        syncStatusEl.textContent = "Pushing to Google Contacts…";
        try {
          const result = await pushGoogle();
          let message =
            "Pushed " + result.pushed + " contact" + (result.pushed === 1 ? "" : "s") +
            " to Google (" + result.created + " new, " + result.updated + " updated).";
          if (result.errors.length) {
            message += " " + result.errors.length + " failed — see below.";
          }
          lastSyncMessage = message;
          await renderList();
          if (result.errors.length) {
            syncStatusEl.className = "sync-status sync-error";
            syncStatusEl.textContent =
              "Some contacts couldn't be pushed: " +
              // Assigned via .textContent below, not innerHTML — no
              // escapeHtml() needed here (it would double-escape entities);
              // .textContent never interprets its value as markup.
              result.errors.map((e) => e.name + " (" + e.error + ")").join("; ");
          }
        } catch (err) {
          syncStatusEl.className = "sync-status sync-error";
          syncStatusEl.textContent = "Push failed: " + err.message;
        } finally {
          btn.disabled = false;
        }
      });

      const countEl = document.getElementById("count");
      const listBody = document.getElementById("list-body");
      const resultSummary = document.getElementById("result-summary");
      const searchInput = document.getElementById("search-input");
      const searchClearBtn = document.getElementById("search-clear");
      const followupToggleBtn = document.getElementById("followup-toggle");

      function attachRowHandlers() {
        for (const tr of listBody.querySelectorAll("tbody tr")) {
          const id = tr.getAttribute("data-id");
          const go = () => navigate("#/contact/" + encodeURIComponent(id));
          tr.addEventListener("click", go);
          tr.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              go();
            }
          });
        }
      }

      function renderEmptyDb() {
        listBody.innerHTML =
          '<section class="empty-state" id="empty-state">' +
          '<span class="icon" aria-hidden="true">&#128101;</span>' +
          "<h2>No contacts yet</h2>" +
          "<p>Add the first person to your rolodex to see them here.</p>" +
          '<button id="add-empty">+ Add contact</button>' +
          "</section>";
        document.getElementById("add-empty").addEventListener("click", () => navigate("#/new"));
      }

      function renderEmptyResults() {
        listBody.innerHTML =
          '<section class="empty-state" id="empty-results-state">' +
          '<span class="icon" aria-hidden="true">&#128269;</span>' +
          "<h2>No matches</h2>" +
          "<p>Try a different name, organization, note, or tag.</p>" +
          "</section>";
      }

      // Third empty state: toggle is ON and nobody currently qualifies.
      // Reassuring tone, no "add contact" CTA — this is a good state to be
      // in, not a gap to fill. Distinct icon from both the empty-DB (person)
      // and empty-search-results (magnifying glass) states so the three are
      // never visually confusable.
      function renderEmptyFollowUp() {
        listBody.innerHTML =
          '<section class="empty-state" id="empty-followup-state">' +
          '<span class="icon" aria-hidden="true">&#10003;</span>' +
          "<h2>You're all caught up</h2>" +
          "<p>Nobody needs a follow-up right now. Check back later, or adjust your follow-up settings.</p>" +
          "</section>";
      }

      function renderRows(list) {
        if (list.length === 0) {
          renderEmptyResults();
          return;
        }
        listBody.innerHTML =
          '<table class="contacts" role="table">' +
          '<thead><tr>' +
          '<th scope="col">Name</th><th scope="col">Organization</th><th scope="col">Verdict</th><th scope="col">Next step</th>' +
          "</tr></thead>" +
          "<tbody>" +
          list.map(rowHtml).join("") +
          "</tbody></table>";
        attachRowHandlers();
      }

      let allContacts = [];
      let totalCount = 0;
      let searchDebounce = null;

      // Follow-up toggle state. `needsFollowUpContacts` is fetched once (in
      // parallel with the normal contacts fetch, below) so the button's count
      // label is accurate before the user ever clicks it; toggling ON reuses
      // that same snapshot rather than re-fetching, since nothing changes it
      // except a fresh renderList() (e.g. navigating away and back, or "Sync
      // now") — a Follow-up window/grace save on the Settings screen only
      // takes effect the next time renderList() itself runs, same as any
      // other navigation back to the list.
      let followUpOn = false;
      let needsFollowUpContacts = null;

      function formatToggleLabel(count) {
        return count === null ? "Needs follow-up" : "Needs follow-up (" + count + ")";
      }

      function setToggleUi() {
        followupToggleBtn.setAttribute("aria-pressed", String(followUpOn));
        followupToggleBtn.classList.toggle("secondary", !followUpOn);
        followupToggleBtn.textContent = formatToggleLabel(
          needsFollowUpContacts ? needsFollowUpContacts.length : null,
        );
      }

      // Search-as-you-type (~250ms debounce), Enter for an immediate search,
      // Escape to clear + refocus — per the search-and-logging design brief.
      // Whitespace-only queries are treated as empty (don't hit the store);
      // an empty DB's own empty state always wins over a search's, since
      // there's nothing to search regardless of what's typed.
      //
      // Toggle + search compose rather than reset each other: the toggle
      // picks the "base list" search filters within (needs-follow-up vs. all
      // contacts), and search filters within whichever base is currently
      // active. Empty-state precedence (most fundamental first): empty DB >
      // toggle-ON-zero-results > search-zero-results.
      async function runSearch(rawQuery) {
        const trimmed = rawQuery.trim();
        searchClearBtn.hidden = trimmed === "";

        if (totalCount === 0) {
          resultSummary.textContent = "";
          renderEmptyDb();
          return;
        }

        const base = followUpOn ? needsFollowUpContacts || [] : allContacts;

        if (followUpOn && base.length === 0) {
          resultSummary.textContent = "";
          renderEmptyFollowUp();
          return;
        }

        if (!trimmed) {
          resultSummary.textContent = "";
          renderRows(base);
          return;
        }
        try {
          const results = await searchContacts(trimmed);
          let matched = results.map((r) => r.contact);
          if (followUpOn) {
            const baseIds = new Set(base.map((c) => c.id));
            matched = matched.filter((c) => baseIds.has(c.id));
          }
          resultSummary.textContent =
            "Showing " + matched.length + " of " + base.length + ' contacts for "' + trimmed + '"';
          renderRows(matched);
        } catch (err) {
          resultSummary.textContent = "Search failed: " + err.message;
          console.error(err);
        }
      }

      followupToggleBtn.addEventListener("click", async () => {
        followUpOn = !followUpOn;
        setToggleUi();
        if (followUpOn && needsFollowUpContacts === null) {
          // The parallel load-time fetch failed earlier — retry now rather
          // than silently showing an empty toggle-on list.
          try {
            needsFollowUpContacts = await getNeedsFollowUp();
            setToggleUi();
          } catch (err) {
            followUpOn = false;
            setToggleUi();
            resultSummary.textContent = "Couldn't load follow-ups: " + err.message;
            console.error(err);
            return;
          }
        }
        runSearch(searchInput.value);
      });

      searchInput.addEventListener("input", () => {
        clearTimeout(searchDebounce);
        const value = searchInput.value;
        searchDebounce = setTimeout(() => runSearch(value), 250);
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          clearTimeout(searchDebounce);
          runSearch(searchInput.value);
        } else if (e.key === "Escape") {
          searchInput.value = "";
          clearTimeout(searchDebounce);
          runSearch("");
          searchInput.focus();
        }
      });
      searchClearBtn.addEventListener("click", () => {
        searchInput.value = "";
        clearTimeout(searchDebounce);
        runSearch("");
        searchInput.focus();
      });

      try {
        // Fetched in parallel, not sequentially: the needs-follow-up count
        // must be accurate on the toggle button before the user ever clicks
        // it, and this avoids a second round-trip on the common
        // load-then-toggle path. A failure on the follow-up side (network
        // hiccup, etc.) shouldn't take down the whole list, so it's caught
        // independently and just leaves the count/toggle in its "unknown"
        // state (retried lazily on click — see the toggle's own handler).
        const [contacts, followUps] = await Promise.all([
          getContacts(),
          getNeedsFollowUp().catch((err) => {
            console.error(err);
            return null;
          }),
        ]);
        allContacts = contacts;
        totalCount = allContacts.length;
        needsFollowUpContacts = followUps;
        countEl.textContent = totalCount + " contact" + (totalCount === 1 ? "" : "s");
        setToggleUi();
        if (totalCount === 0) {
          renderEmptyDb();
          return;
        }
        renderRows(allContacts);
      } catch (err) {
        countEl.textContent = "Failed to load contacts";
        console.error(err);
      }

    }

    function settingsFormHtml(windowDays, graceDays) {
      return (
        '<form class="log-interaction-form" id="settings-form" aria-label="Follow-up settings" novalidate>' +
        '<div class="form-error-banner" id="settings-form-error" hidden></div>' +
        '<div class="form-field" id="settings-window-field">' +
        '<label for="settings-window">Follow-up window (days)</label>' +
        '<input type="number" id="settings-window" min="1" step="1" inputmode="numeric" ' +
        'value="' + escapeHtml(String(windowDays)) + '" aria-describedby="settings-window-error" />' +
        '<span class="field-error" id="settings-window-error" hidden>Enter a positive whole number.</span>' +
        "</div>" +
        '<div class="form-field" id="settings-grace-field">' +
        '<label for="settings-grace">Grace period (days)</label>' +
        '<input type="number" id="settings-grace" min="1" step="1" inputmode="numeric" ' +
        'value="' + escapeHtml(String(graceDays)) + '" aria-describedby="settings-grace-error" />' +
        '<span class="field-error" id="settings-grace-error" hidden>Enter a positive whole number.</span>' +
        "</div>" +
        '<div class="form-actions">' +
        '<button type="button" class="secondary" id="settings-cancel">Cancel</button>' +
        '<button type="submit" id="settings-save">Save</button>' +
        "</div>" +
        "</form>"
      );
    }

    // The Appearance section — a theme toggle plus a 10-thumbnail grid over
    // the app-icon candidates preserved at .pHive/design/app-icon/renditions/
    // (see that epic's brief for how they were generated). Selecting either
    // control PUTs the full {theme, iconId} pair (server.ts's route wants
    // both together, matching what GET / injects on every load) and applies
    // immediately client-side via applyAppearance() below — the server-side
    // injection in GET / is what makes a plain reload/reopen correct too,
    // this is just for not needing one.
    const ICON_CANDIDATE_COUNT = 10;
    function appearanceSectionHtml(theme, iconId) {
      const themeButtons = ["default", "brass"]
        .map(
          (t) =>
            '<button type="button" class="secondary theme-option" data-theme-option="' + t + '" ' +
            'aria-pressed="' + (t === theme) + '">' + (t === "default" ? "Default" : "Brass") + "</button>",
        )
        .join("");
      const iconButtons = Array.from({ length: ICON_CANDIDATE_COUNT }, (_, i) => i + 1)
        .map(
          (n) =>
            '<button type="button" class="icon-option" data-icon-id="' + n + '" ' +
            'aria-pressed="' + (n === iconId) + '" aria-label="Icon option ' + n + '">' +
            '<img src="/assets/icon-c' + n + '-32.png" alt="" width="32" height="32" /></button>',
        )
        .join("");
      return (
        '<div class="log-interaction-form" id="appearance-section">' +
        '<h3 class="settings-section-title">Appearance</h3>' +
        '<div class="form-error-banner" id="appearance-error" hidden></div>' +
        '<div class="form-field">' +
        '<label id="appearance-theme-label">Theme</label>' +
        '<div class="theme-toggle" role="group" aria-labelledby="appearance-theme-label">' + themeButtons + "</div>" +
        "</div>" +
        '<div class="form-field">' +
        '<label id="appearance-icon-label">App icon</label>' +
        '<div class="icon-grid" role="group" aria-labelledby="appearance-icon-label">' + iconButtons + "</div>" +
        "</div>" +
        "</div>"
      );
    }

    // Rewrites the <head> favicon links and the <html> data-theme attribute
    // in place — the same values GET / would inject on a fresh load, just
    // applied without one. Browsers cache favicons aggressively, so a tab
    // that's already open may not visibly repaint until its next
    // navigation/reload; that's a known browser limitation, not a bug here.
    function applyAppearance(theme, iconId) {
      if (theme === "brass") document.documentElement.setAttribute("data-theme", "brass");
      else document.documentElement.removeAttribute("data-theme");
      const linkSwaps = [
        ['link[rel="icon"][sizes="any"]', "/assets/icon-c" + iconId + ".ico"],
        ['link[rel="icon"][sizes="32x32"]', "/assets/icon-c" + iconId + "-32.png"],
        ['link[rel="icon"][sizes="16x16"]', "/assets/icon-c" + iconId + "-16.png"],
        ['link[rel="apple-touch-icon"]', "/assets/icon-c" + iconId + "-180.png"],
      ];
      for (const [selector, href] of linkSwaps) {
        const el = document.querySelector(selector);
        if (el) el.setAttribute("href", href);
      }
    }

    // Tracks the settings page's current appearance selection so a save PUTs
    // the full {theme, iconId} pair even though theme and icon are two
    // separate button groups — the server route (and GET /'s injection)
    // always wants both together.
    function wireAppearanceSection(theme, iconId) {
      let current = { theme, iconId };
      const errorBanner = document.getElementById("appearance-error");

      function setPressedState() {
        document.querySelectorAll(".theme-option").forEach((btn) => {
          btn.setAttribute("aria-pressed", String(btn.dataset.themeOption === current.theme));
        });
        document.querySelectorAll(".icon-option").forEach((btn) => {
          btn.setAttribute("aria-pressed", String(Number(btn.dataset.iconId) === current.iconId));
        });
      }

      async function save(next) {
        const prev = current;
        current = next;
        setPressedState();
        applyAppearance(current.theme, current.iconId);
        try {
          await putAppearanceSettings(current);
          errorBanner.hidden = true;
        } catch (err) {
          // Revert on failure, matching the follow-up form's
          // keep-the-page-usable-with-error behavior on save failure.
          current = prev;
          setPressedState();
          applyAppearance(current.theme, current.iconId);
          errorBanner.hidden = false;
          errorBanner.textContent = "Couldn't save: " + err.message;
        }
      }

      document.querySelectorAll(".theme-option").forEach((btn) => {
        btn.addEventListener("click", () => save({ theme: btn.dataset.themeOption, iconId: current.iconId }));
      });
      document.querySelectorAll(".icon-option").forEach((btn) => {
        btn.addEventListener("click", () => save({ theme: current.theme, iconId: Number(btn.dataset.iconId) }));
      });
    }

    // The Autostart section — only ever rendered when GET /api/settings/
    // autostart reports supported:true, i.e. running inside the packaged
    // Electron app (src/electron/main.ts injects the real
    // app.setLoginItemSettings-backed implementation; a plain `npm run
    // shell` dev server has no OS concept of "autostart" at all, so there
    // is nothing useful to show there — omitted entirely rather than shown
    // disabled).
    function autostartSectionHtml(enabled) {
      return (
        '<div class="log-interaction-form" id="autostart-section">' +
        '<h3 class="settings-section-title">Startup</h3>' +
        '<label class="checkbox-field">' +
        '<input type="checkbox" id="autostart-toggle"' + (enabled ? " checked" : "") + " />" +
        " Start rolodex at login" +
        "</label>" +
        "</div>"
      );
    }

    function wireAutostartSection() {
      const toggle = document.getElementById("autostart-toggle");
      if (!toggle) return;
      toggle.addEventListener("change", async () => {
        const desired = toggle.checked;
        toggle.disabled = true;
        try {
          await putAutostartSettings({ enabled: desired });
        } catch (err) {
          // Revert the checkbox on failure rather than showing a
          // checked/unchecked state that doesn't match what's actually
          // registered with the OS.
          toggle.checked = !desired;
          console.error(err);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // The Google section — a real three-state account status line (Signed
    // in / Client configured, not signed in / Not configured — computed
    // server-side from GET /api/wizard/summary's googleConfigured +
    // googleSignedIn, since googleConfigured alone can't distinguish
    // "configured but never signed in" from "fully connected") plus a
    // "Reconnect Google" entry point for establishing/re-establishing the
    // connection without rerunning the first-run wizard. Reuses the exact
    // same server route (POST /api/wizard/google/connect) and
    // connecting/cancel/success/error UX pattern already proven by
    // wizard.html's runConnect(). The reconnect-actions area starts empty —
    // wireGoogleSection() (called right after this is dropped into the DOM)
    // renders the idle button into it, so there is exactly one place that
    // creates that button and attaches its listener.
    function googleAccountStatusText(status) {
      if (status === "signed-in") return { kind: "success", text: "✓ Signed in." };
      if (status === "configured") return { kind: "", text: "Client configured, not signed in yet." };
      return { kind: "", text: "Not configured." };
    }
    function googleSectionHtml(status) {
      const initial = googleAccountStatusText(status);
      return (
        '<div class="log-interaction-form" id="google-section">' +
        '<h3 class="settings-section-title">Google account</h3>' +
        '<div class="status-line' + (initial.kind ? " " + initial.kind : "") + '" id="google-account-status">' + initial.text + "</div>" +
        '<div id="google-reconnect-status" class="status-line" aria-live="polite"></div>' +
        '<div class="form-actions" id="google-reconnect-actions"></div>' +
        "</div>"
      );
    }

    // AbortController for an in-flight "Reconnect Google" request, if any —
    // tracked at module scope (not just inside runReconnect()'s own
    // closure) purely so a future caller could abort it from elsewhere; the
    // settings page itself doesn't need to abort on navigate-away today
    // since showGoogleStatus()'s own `if (!el) return` guard already makes
    // a stale in-flight update after leaving the page a safe no-op, not a
    // crash.
    let reconnectController = null;

    function showGoogleStatus(kind, html) {
      const el = document.getElementById("google-reconnect-status");
      if (!el) return;
      el.className = "status-line" + (kind ? " " + kind : "");
      el.innerHTML = html;
    }

    function setGoogleActionsIdle() {
      const actions = document.getElementById("google-reconnect-actions");
      if (!actions) return;
      actions.innerHTML = '<button type="button" class="secondary" id="reconnect-google-btn">Reconnect Google</button>';
      document.getElementById("reconnect-google-btn").addEventListener("click", runReconnect);
    }

    function setGoogleActionsConnecting() {
      const actions = document.getElementById("google-reconnect-actions");
      if (!actions) return;
      actions.innerHTML = '<button type="button" class="secondary" id="reconnect-google-cancel">Cancel</button>';
      document.getElementById("reconnect-google-cancel").addEventListener("click", () => {
        if (reconnectController) reconnectController.abort();
      });
    }

    // Runs the real OAuth loopback consent flow via the same
    // POST /api/wizard/google/connect route the wizard's Google-connect
    // step uses (src/shell/server.ts), and the same abort-propagation
    // guarantee: aborting `controller` here aborts this fetch, which (per
    // api()'s plain `await fetch(...)`) rejects with an AbortError that
    // this function distinguishes from a real failure below — the server
    // side of that guarantee (req.on("close") -> AbortSignal ->
    // connectGoogleAccount) is entirely inside the shared route and does
    // not change based on which UI called it.
    async function runReconnect() {
      showGoogleStatus(
        "checking",
        '<span class="spinner" aria-hidden="true"></span> Connecting… waiting for you to finish in your browser.',
      );
      setGoogleActionsConnecting();
      const controller = new AbortController();
      reconnectController = controller;
      try {
        await api("/api/wizard/google/connect", { method: "POST", signal: controller.signal });
        reconnectController = null;
        showGoogleStatus("success", "&#10003; Google account connected.");
        setGoogleActionsIdle();
        // A successful connect means a fresh token was just stored — update
        // the account-status line in place rather than re-fetching the
        // whole wizard summary just for this one field.
        const statusEl = document.getElementById("google-account-status");
        if (statusEl) {
          const signedIn = googleAccountStatusText("signed-in");
          statusEl.className = "status-line" + (signedIn.kind ? " " + signedIn.kind : "");
          statusEl.textContent = signedIn.text;
        }
      } catch (err) {
        reconnectController = null;
        if (err && err.name === "AbortError") {
          showGoogleStatus("", "Connection canceled. You can try connecting again whenever you're ready.");
        } else {
          showGoogleStatus("error", escapeHtml((err && err.message) || "Something went wrong connecting your Google account."));
        }
        setGoogleActionsIdle();
      }
    }

    function wireGoogleSection() {
      setGoogleActionsIdle();
    }

    // The Database location section — new this epic, not migrated from
    // anywhere. Reuses the wizard's own GET/POST /api/wizard/database +
    // POST .../reset routes verbatim (same writable-check gate: a rejected
    // candidate never overwrites a working override). Unlike the wizard,
    // this can never take effect live — `Store`/`secrets` are both
    // memoized for the server process's lifetime (see the epic's design
    // discussion) — so a successful change/reset shows a persistent
    // "restart to apply" note instead of implying anything happened
    // immediately.
    function databaseSectionHtml() {
      return (
        '<div class="log-interaction-form" id="database-section">' +
        '<h3 class="settings-section-title">Database location</h3>' +
        '<div class="settings-path-value" id="db-path-display">Checking&hellip;</div>' +
        '<div class="status-line" id="db-status" aria-live="polite"></div>' +
        '<div class="form-actions">' +
        '<button type="button" class="secondary" id="db-change-toggle">Change&hellip;</button>' +
        '<button type="button" class="secondary" id="db-reset" hidden>Reset to default</button>' +
        "</div>" +
        '<div class="form-field" id="db-change-panel" hidden>' +
        '<label for="db-path-input">New location (full file path)</label>' +
        '<input type="text" id="db-path-input" autocomplete="off" spellcheck="false" />' +
        '<div class="form-actions"><button type="button" id="db-path-apply">Check this location</button></div>' +
        "</div>" +
        '<div class="settings-note" id="db-apply-note" hidden>Applies next launch — restart rolodex to switch.</div>' +
        "</div>"
      );
    }

    function wireDatabaseSection() {
      const display = document.getElementById("db-path-display");
      const status = document.getElementById("db-status");
      const resetBtn = document.getElementById("db-reset");
      const changeToggle = document.getElementById("db-change-toggle");
      const changePanel = document.getElementById("db-change-panel");
      const pathInput = document.getElementById("db-path-input");
      const applyNote = document.getElementById("db-apply-note");

      function paint(result) {
        display.textContent = result.path;
        resetBtn.hidden = result.isDefault;
        if (result.writable) {
          status.className = "status-line success";
          status.textContent = "✓ This location is writable.";
        } else {
          status.className = "status-line error";
          status.textContent =
            "This location isn't writable — choose a different folder or use the default." +
            (result.error ? " " + result.error : "");
        }
      }

      changeToggle.addEventListener("click", () => {
        changePanel.hidden = !changePanel.hidden;
        if (!changePanel.hidden) pathInput.focus();
      });

      document.getElementById("db-path-apply").addEventListener("click", async () => {
        const candidate = pathInput.value.trim();
        if (!candidate) return;
        status.className = "status-line";
        status.textContent = "Checking…";
        const result = await postDbLocation(candidate);
        paint(result);
        if (result.writable) {
          applyNote.hidden = false;
          pathInput.value = "";
          changePanel.hidden = true;
        }
      });

      resetBtn.addEventListener("click", async () => {
        if (!confirm("Reset the database location to the default path? This only changes where rolodex looks for data — it doesn't move or delete anything.")) return;
        status.className = "status-line";
        status.textContent = "Checking…";
        const result = await postDbLocationReset();
        paint(result);
        applyNote.hidden = false;
      });

      getDbLocation().then(paint).catch((err) => {
        status.className = "status-line error";
        status.textContent = "Couldn't load: " + err.message;
      });
    }

    // The Secrets backend section — new this epic, not migrated from
    // anywhere. Only ever rendered when Portunus is actually available
    // (same convention as the Autostart section: omitted entirely, not
    // shown with a single disabled option, when there's no real choice to
    // make) — reuses GET /api/wizard/secrets-backends (now also reporting
    // currentBackend) and POST /api/wizard/secrets-backend-choice verbatim.
    // No live secrets-check/troubleshooting UI here — that's the wizard's
    // heavier first-run verification flow; this section is just the
    // choice itself, same "restart to apply" note as the Database section
    // since the choice can't take effect mid-process either.
    function secretsBackendSectionHtml(current) {
      return (
        '<div class="log-interaction-form" id="secrets-backend-section">' +
        '<h3 class="settings-section-title">Secrets backend</h3>' +
        '<div class="backend-toggle" role="group" aria-label="Secrets backend">' +
        '<button type="button" class="secondary backend-option" data-backend-option="keychain" ' +
        'aria-pressed="' + (current === "keychain") + '">macOS Keychain</button>' +
        '<button type="button" class="secondary backend-option" data-backend-option="portunus" ' +
        'aria-pressed="' + (current === "portunus") + '">Portunus</button>' +
        "</div>" +
        '<div class="settings-note" id="secrets-backend-apply-note" hidden>Applies next launch — restart rolodex to switch.</div>' +
        "</div>"
      );
    }

    function wireSecretsBackendSection(current) {
      const applyNote = document.getElementById("secrets-backend-apply-note");
      const options = document.querySelectorAll(".backend-option");
      function setPressed(backend) {
        options.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.backendOption === backend)));
      }
      options.forEach((btn) => {
        btn.addEventListener("click", async () => {
          const backend = btn.dataset.backendOption;
          const prev = current;
          current = backend;
          setPressed(current);
          try {
            await postSecretsBackendChoice(backend);
            applyNote.hidden = false;
          } catch (err) {
            // Revert on failure — nothing was actually persisted.

            setPressed(current);
            console.error(err);
          }

    }

    function rowHtml(c) {
      const meta = verdictMeta(c.verdict);
      const next = c.nextStep || "";
      const truncated = next.length > 40 ? next.slice(0, 40) + "…" : next;
      return (
        '<tr tabindex="0" data-id="' + escapeHtml(c.id) + '">' +
        "<td>" + escapeHtml(c.name) + "</td>" +
        "<td>" + escapeHtml(c.org || "") + "</td>" +
        '<td><span class="verdict-badge verdict-' + escapeHtml(c.verdict) + '">' +
        meta.icon + " " + meta.label +
        "</span></td>" +
        '<td class="next-step" title="' + escapeHtml(next) + '">' + escapeHtml(truncated) + "</td>" +
        "</tr>"
      );
    }

    // ---- Settings view ----------------------------------------------------
    // Replaces the old gear-icon popover with a real, navigable screen —
    // same router/topbar/#content pattern renderList/renderDetail/renderForm
    // already use, not a separate served page (see the settings-account-
    // screen epic's design discussion for why). Sections land here one epic
    // story at a time; today it's Follow-up + Appearance, migrated as-is
    // from the popover's own HTML-builder/wiring functions (now top-level,
    // shared with the still-present-but-dead popover code).
    async function renderSettings() {
      setTopbar({
        left: '<button class="back-link" id="back-link">&larr; Contacts</button>',
        right: "",
      });
      document.getElementById("back-link").addEventListener("click", () => navigate("#/"));

      content.innerHTML =
        '<div class="settings-page">' +
        "<h1>Settings</h1>" +
        '<p class="settings-subtitle">Follow-up window, appearance, and account settings.</p>' +
        '<section aria-labelledby="follow-up-heading">' +
        '<h2 class="settings-section-title" id="follow-up-heading">Follow-up window</h2>' +
        '<div id="follow-up-section-body">Loading&hellip;</div>' +
        "</section>" +
        '<section>' +
        '<div id="appearance-section-body">Loading&hellip;</div>' +
        "</section>" +
        '<section>' +
        '<div id="autostart-section-body"></div>' +
        "</section>" +
        '<section>' +
        '<div id="google-section-body">Loading&hellip;</div>' +
        "</section>" +
        '<section>' + databaseSectionHtml() + "</section>" +
        '<section>' +
        '<div id="secrets-backend-section-body"></div>' +
        "</section>" +
        "</div>";

      let saved = { windowDays: 30, graceDays: 14 };
      try {
        saved = await getFollowUpSettings();
      } catch (err) {
        console.error(err);
      }

      const body = document.getElementById("follow-up-section-body");
      body.innerHTML =
        settingsFormHtml(saved.windowDays, saved.graceDays) +
        '<div class="status-line" id="follow-up-save-status" aria-live="polite"></div>';

      const windowInput = document.getElementById("settings-window");
      const graceInput = document.getElementById("settings-grace");
      const statusEl = document.getElementById("follow-up-save-status");

      function setStatus(kind, text) {
        statusEl.className = "status-line" + (kind ? " " + kind : "");
        statusEl.textContent = text;
      }

      function validatePositiveInt(input, fieldId, errorId) {
        const raw = input.value.trim();
        const n = Number(raw);
        const valid = raw !== "" && Number.isInteger(n) && n > 0;
        document.getElementById(fieldId).classList.toggle("invalid", !valid);
        document.getElementById(errorId).hidden = valid;
        if (valid) input.removeAttribute("aria-invalid");
        else input.setAttribute("aria-invalid", "true");
        return valid ? n : null;
      }

      document.getElementById("settings-cancel").addEventListener("click", () => {
        windowInput.value = saved.windowDays;
        graceInput.value = saved.graceDays;
        validatePositiveInt(windowInput, "settings-window-field", "settings-window-error");
        validatePositiveInt(graceInput, "settings-grace-field", "settings-grace-error");
        setStatus("", "");
      });

      document.getElementById("settings-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const windowDays = validatePositiveInt(windowInput, "settings-window-field", "settings-window-error");
        const graceDays = validatePositiveInt(graceInput, "settings-grace-field", "settings-grace-error");
        if (windowDays === null || graceDays === null) {
          (windowDays === null ? windowInput : graceInput).focus();
          return;
        }
        const saveBtn = document.getElementById("settings-save");
        saveBtn.disabled = true;
        try {
          await putFollowUpSettings({ windowDays, graceDays });
          saved = { windowDays, graceDays };
          setStatus("success", "Saved.");
        } catch (err) {
          setStatus("error", "Couldn't save: " + err.message);
        } finally {
          saveBtn.disabled = false;
        }
      });

      let appearance = { theme: "default", iconId: 6 };
      try {
        appearance = await getAppearanceSettings();
      } catch (err) {
        console.error(err);
      }
      document.getElementById("appearance-section-body").innerHTML = appearanceSectionHtml(appearance.theme, appearance.iconId);
      wireAppearanceSection(appearance.theme, appearance.iconId);

      let autostart = { supported: false, enabled: false };
      try {
        autostart = await getAutostartSettings();
      } catch (err) {
        console.error(err);
      }
      if (autostart.supported) {
        document.getElementById("autostart-section-body").innerHTML = autostartSectionHtml(autostart.enabled);
        wireAutostartSection();
      }

      let googleStatus = "not-configured";
      try {
        const summary = await getWizardSummary();
        googleStatus = summary.googleSignedIn ? "signed-in" : summary.googleConfigured ? "configured" : "not-configured";
      } catch (err) {
        console.error(err);
      }
      document.getElementById("google-section-body").innerHTML = googleSectionHtml(googleStatus);
      wireGoogleSection();

      wireDatabaseSection();

      try {
        const backends = await getSecretsBackends();
        if (backends.portunusAvailable) {
          document.getElementById("secrets-backend-section-body").innerHTML = secretsBackendSectionHtml(backends.currentBackend);
          wireSecretsBackendSection(backends.currentBackend);
        }
      } catch (err) {
        console.error(err);
      }
    }
