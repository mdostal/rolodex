<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rolodex</title>
  <style>
    :root {
      color-scheme: light dark;
      --border: #d9d9df;
      --muted: #6b6b76;
      --bg: #fff;
      --fg: #1b1b1f;
      --accent: #2f5ed9;
      --accent-bg: #eef2fd;
      --danger: #b3261e;
      --ok-bg: #e7f6ec;
      --ok-fg: #1e7b34;
      --row-hover: #f4f5f8;
      --chip-bg: #eef0f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      min-width: 960px;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    a { color: var(--accent); }
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
    }
    .topbar .brand { font-weight: 600; font-size: 1rem; }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .back-link, .cancel-link {
      background: none; border: none; color: var(--accent); font: inherit; cursor: pointer;
      padding: 6px 4px; border-radius: 6px;
    }
    .back-link:focus-visible, .cancel-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      min-height: 32px;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--fg); }
    button:disabled { background: #c9c9d1; border-color: #c9c9d1; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 80px; }
    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .page-header h1 { font-size: 1.5rem; margin: 0 0 4px; }
    #count { color: var(--muted); font-size: 0.95rem; }
    .search { position: relative; display: flex; align-items: center; }
    .search input {
      min-width: 240px;
      padding: 8px 32px 8px 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
    }
    .search-icon { position: absolute; left: 8px; opacity: 0.6; font-size: 0.85rem; pointer-events: none; }
    .search-clear {
      position: absolute; right: 2px; min-width: 32px; min-height: 32px; padding: 0;
      background: none; border: none; color: var(--muted); font-size: 1rem; border-radius: 6px; cursor: pointer;
    }
    .search-clear:hover { background: var(--row-hover); }
    #result-summary { color: var(--muted); font-size: 0.9rem; margin: -8px 0 16px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .sync-status { font-size: 0.9rem; color: var(--ok-fg); min-height: 1.2em; margin: 0 0 16px; }
    .sync-status.sync-error { color: var(--danger); }
    .empty-state {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; }
    .empty-state h2 { margin: 0; color: var(--fg); font-size: 1.1rem; }
    .empty-state p { margin: 0 0 8px; max-width: 32ch; }

    /* Contact table */
    table.contacts { width: 100%; border-collapse: collapse; }
    table.contacts th {
      text-align: left; font-size: 0.85rem; color: var(--muted); font-weight: 600;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    table.contacts tbody tr {
      cursor: pointer; min-height: 40px;
    }
    table.contacts tbody tr:hover, table.contacts tbody tr:focus-visible { background: var(--row-hover); }
    table.contacts tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    table.contacts td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.contacts td.next-step { color: var(--muted); }

    .verdict-badge { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .verdict-strong { color: #1e7b34; }
    .verdict-watch { color: #a3720b; }
    .verdict-referral-only { color: #2f5ed9; }
    .verdict-pass { color: var(--muted); }
    .verdict-none { color: var(--muted); }

    /* Detail screen */
    .detail-header h1 { margin: 0 0 2px; font-size: 1.75rem; }
    .detail-header .subordinate { color: var(--muted); margin: 0 0 24px; }
    .detail-columns { display: flex; gap: 40px; align-items: flex-start; }
    .detail-columns .col { flex: 1 1 0; min-width: 0; }
    .detail-columns h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 24px 0 8px; }
    .detail-columns h2:first-of-type { margin-top: 0; }
    .field-row { margin: 0 0 10px; }
    .field-row .label { color: var(--muted); font-size: 0.85rem; margin-right: 6px; }
    .field-row .value { font-size: 1rem; }
    .tag-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-list li {
      background: var(--chip-bg); border-radius: 999px; padding: 3px 10px; font-size: 0.85rem;
    }
    @media (max-width: 800px) {
      .detail-columns { flex-direction: column; }
    }

    /* Verdict segmented control */
    .verdict-picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .verdict-picker [role="radio"] {
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 0.9rem;
      background: transparent; color: var(--fg); cursor: pointer;
    }
    .verdict-picker [role="radio"][aria-checked="true"] {
      background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600;
    }
    .autosave-status {
      font-size: 0.85rem; color: var(--ok-fg); min-height: 1.2em; margin: 0 0 20px;
    }
    .next-step-field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .next-step-field input {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: inherit; font: inherit;
    }
    .interactions-panel {
      margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .interactions-panel .interactions-header {
      display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;
    }
    .interactions-panel h2 { margin: 0; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }

    /* Log-interaction disclosure form */
    .log-interaction-form {
      border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 16px;
    }
    .log-interaction-form fieldset { border: none; padding: 0; margin: 0 0 12px; }
    .log-interaction-form legend { font-size: 0.85rem; color: var(--muted); padding: 0; margin-bottom: 6px; }
    .channel-picker { display: flex; flex-wrap: wrap; gap: 10px; }
    .channel-picker label {
      display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: normal;
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    }
    .channel-picker input[type="radio"]:checked + span,
    .channel-picker label:has(input:checked) { border-color: var(--accent); color: var(--accent); }
    .log-interaction-form .form-field { margin-bottom: 12px; }
    .log-interaction-form .form-field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    .log-interaction-form input[type="date"], .log-interaction-form input[type="number"], .log-interaction-form textarea {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: inherit; font: inherit;
    }
    .log-interaction-form textarea { min-height: 64px; resize: vertical; }
    .log-interaction-form .form-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Follow-up settings popover — anchored under-right of the gear button,
       reusing .log-interaction-form's border/padding/fieldset styling as-is;
       this pair is the one CSS addition the design brief allows for
       positioning the popover itself. */
    .settings-anchor { position: relative; display: inline-block; margin-right: 8px; }
    .settings-panel {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 20;
      width: 260px; margin-bottom: 0; background: var(--bg);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    /* Interaction history */
    .interaction-history { list-style: none; margin: 0; padding: 0; }
    .interaction-row {
      display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .interaction-row:last-child { border-bottom: none; }
    .channel-badge {
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 0.85rem;
      color: var(--muted); flex: 0 0 auto; min-width: 90px;
    }
    .interaction-row .interaction-body { flex: 1 1 auto; min-width: 0; }
    .interaction-row .interaction-date { font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
    .interaction-row .interaction-note { white-space: pre-wrap; word-break: break-word; }
    .show-more-link {
      background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 8px 0 0;
    }
    .empty-history {
      color: var(--muted); font-size: 0.9rem; padding: 8px 0;
    }
    .not-found-banner {
      background: #fdecea; color: var(--danger); border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
    }

    /* Form */
    form.contact-form fieldset {
      border: none; padding: 0; margin: 0 0 28px;
    }
    form.contact-form legend {
      font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted);
      padding: 0; margin-bottom: 12px; width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 0.9rem; }
    .form-field .required { color: var(--danger); }
    .form-field input, .form-field textarea {
      padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: inherit; font: inherit;
    }
    .form-field textarea { min-height: 72px; resize: vertical; }
    .form-field.invalid input { border-color: var(--danger); }
    .field-error { color: var(--danger); font-size: 0.85rem; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 12px; }
    .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: normal; }
    .chip-input-wrap {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 6px;
    }
    .chip-input-wrap input {
      border: none; flex: 1 1 120px; min-width: 120px; padding: 4px; background: transparent; color: inherit; font: inherit;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; background: var(--chip-bg); border-radius: 999px;
      padding: 3px 6px 3px 10px; font-size: 0.85rem;
    }
    .chip button {
      all: unset; cursor: pointer; padding: 0 4px; color: var(--muted); font-size: 0.85rem; min-height: auto;
    }
    .chip button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .form-error-banner {
      background: #fdecea; color: var(--danger); border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
    }
    .form-footer {
      /* Deliberately NOT position: sticky/fixed. The page itself is the only
         scroll container (there's no independent scroll pane for #content),
         so a sticky-to-viewport footer here reserves its own space at the
         very end of the form flow *and* simultaneously pins itself over the
         bottom `footerHeight` px of the viewport while "stuck". Those two
         facts combine badly: whatever field happens to fall in that bottom
         strip — which for this form is the Classification/Next-step section
         on a typical viewport — renders directly underneath the footer's
         hit-testable (and visually opaque) box, well before the user has
         scrolled anywhere near the true bottom of the page. No amount of
         extra padding/margin between the fields and the footer fixes this:
         the sticky-stuck screen position is fixed by viewport height minus
         footer height, not by document content, so the overlap band never
         moves. A plain static footer (matching the non-sticky verdict picker
         on the Contact Detail screen) can never overlap the fields above it,
         at any scroll position or viewport size — it simply sits after them
         in normal flow. */
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 14px 0; margin-top: 12px; display: flex; justify-content: flex-end; gap: 10px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left" id="topbar-left">
      <span class="brand">rolodex</span>
    </div>
    <div class="topbar-right" id="topbar-right">
      <button id="add-top">+ Add contact</button>
    </div>
  </header>

  <main id="main">
    <div id="content"></div>
  </main>

  <script>
    "use strict";

    // ---- tiny fetch helpers -------------------------------------------------
    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) {
        let msg = "request failed: " + res.status;
        try {
          const body = await res.json();
          if (body && body.error) msg = body.error;
        } catch {}
        throw new Error(msg);
      }
      if (res.status === 204) return null;
      return res.json();
    }
    const getContacts = () => api("/api/contacts");
    const getContact = (id) => api("/api/contacts/" + encodeURIComponent(id));
    const saveContact = (payload) =>
      api("/api/contacts", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    const patchVerdict = (id, verdict) =>
      api("/api/contacts/" + encodeURIComponent(id) + "/verdict", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ verdict }),
      });
    const patchNextStep = (id, nextStep) =>
      api("/api/contacts/" + encodeURIComponent(id) + "/next-step", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ nextStep }),
      });
    const syncGoogle = () => api("/api/sync/google", { method: "POST" });
    const searchContacts = (q) => api("/api/contacts/search?q=" + encodeURIComponent(q));
    const getNeedsFollowUp = () => api("/api/contacts/needs-follow-up");
    const getFollowUpSettings = () => api("/api/settings/follow-up");
    const putFollowUpSettings = (payload) =>
      api("/api/settings/follow-up", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    const getInteractions = (id) => api("/api/contacts/" + encodeURIComponent(id) + "/interactions");
    const postInteraction = (id, payload) =>
      api("/api/contacts/" + encodeURIComponent(id) + "/interactions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });

    // Set by the "Sync now" handler, displayed once by the very next
    // renderList() (the sync handler re-renders the list to pick up any
    // newly-pulled contacts, which would otherwise wipe out an inline status
    // message written into the markup it just replaced).
    let lastSyncMessage = null;

    // ---- shared data ----------------------------------------------------------
    const VERDICTS = [
      { value: "strong", icon: "●", label: "Strong" },
      { value: "watch", icon: "◐", label: "Watch" },
      { value: "referral-only", icon: "◇", label: "Referral only" },
      { value: "pass", icon: "✕", label: "Pass" },
      { value: "none", icon: "○", label: "None" },
    ];
    const verdictMeta = (v) => VERDICTS.find((x) => x.value === v) || VERDICTS[4];

    const CHANNELS = [
      { value: "call", icon: "☎", label: "Call" },
      { value: "email", icon: "✉", label: "Email" },
      { value: "dm", icon: "◆", label: "DM" },
      { value: "meeting", icon: "▦", label: "Meeting" },
      { value: "other", icon: "○", label: "Other" },
    ];
    const channelMeta = (v) => CHANNELS.find((c) => c.value === v) || CHANNELS[4];

    function todayIso() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function formatInteractionDate(at) {
      // `at` may be a bare date (YYYY-MM-DD, the DateField's native format)
      // or a full ISO timestamp. A bare date passed straight to `new Date()`
      // is parsed as UTC midnight, which toLocaleDateString() then renders
      // in the browser's local zone — one day early for any zone behind
      // UTC. Build a local-midnight Date from the parts instead so a
      // DateField value of "2026-08-11" always displays as Aug 11, not the
      // 10th, regardless of timezone. Full timestamps (with a time/zone
      // component) really do denote an absolute instant, so those still go
      // through Date() as-is.
      const bareDate = /^\d{4}-\d{2}-\d{2}$/.exec(at);
      const d = bareDate
        ? new Date(Number(bareDate[0].slice(0, 4)), Number(bareDate[0].slice(5, 7)) - 1, Number(bareDate[0].slice(8, 10)))
        : new Date(at);
      if (isNaN(d.getTime())) return at;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // ---- router -----------------------------------------------------------
    function parseRoute() {
      const hash = location.hash.replace(/^#/, "") || "/";
      const segs = hash.split("/").filter(Boolean);
      if (segs.length === 0) return { view: "list" };
      if (segs[0] === "new") return { view: "form", mode: "add" };
      if (segs[0] === "contact" && segs[1] && segs[2] === "edit") return { view: "form", mode: "edit", id: decodeURIComponent(segs[1]) };
      if (segs[0] === "contact" && segs[1]) return { view: "detail", id: decodeURIComponent(segs[1]) };
      return { view: "list" };
    }

    function setTopbar({ left, right }) {
      document.getElementById("topbar-left").innerHTML = left;
      document.getElementById("topbar-right").innerHTML = right;
    }

    function navigate(hash) {
      location.hash = hash;
    }

    const content = document.getElementById("content");

    async function render() {
      const route = parseRoute();
      try {
        if (route.view === "list") await renderList();
        else if (route.view === "detail") await renderDetail(route.id);
        else if (route.view === "form") await renderForm(route.mode, route.id);
      } catch (err) {
        content.innerHTML = '<p class="not-found-banner">' + escapeHtml(err.message || String(err)) + "</p>";
        console.error(err);
      }
    }

    // ---- List view ----------------------------------------------------------
    async function renderList() {
      setTopbar({
        left: '<span class="brand">rolodex</span>',
        right:
          '<span class="settings-anchor" id="settings-anchor">' +
          '<button type="button" class="secondary" id="settings-toggle" aria-label="Follow-up settings" ' +
          'aria-expanded="false" aria-controls="settings-panel-wrap">&#9881;</button>' +
          '<div id="settings-panel-wrap"></div>' +
          "</span>" +
          '<button id="add-top">+ Add contact</button>',
      });
      content.innerHTML =
        '<div class="page-header">' +
        "<div><h1>Contacts</h1><div id=\"count\" aria-live=\"polite\">Loading…</div></div>" +
        '<div class="header-actions">' +
        '<div class="search">' +
        '<label for="search-input" class="sr-only">Search contacts</label>' +
        '<span class="search-icon" aria-hidden="true">&#128269;</span>' +
        '<input id="search-input" type="search" placeholder="Search name, org, notes, tags…" />' +
        '<button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>' +
        "</div>" +
        '<button type="button" class="secondary" id="followup-toggle" aria-pressed="false">Needs follow-up</button>' +
        '<button type="button" class="secondary" id="sync-now">Sync now</button>' +
        "</div>" +
        "</div>" +
        '<div id="result-summary" aria-live="polite"></div>' +
        '<div class="sync-status" id="sync-status" aria-live="polite"></div>' +
        '<div id="list-body"></div>';

      document.getElementById("add-top").addEventListener("click", () => navigate("#/new"));
      wireSettingsPanel();

      const syncStatusEl = document.getElementById("sync-status");
      if (lastSyncMessage) {
        syncStatusEl.textContent = lastSyncMessage;
        lastSyncMessage = null;
      }
      document.getElementById("sync-now").addEventListener("click", async () => {
        const btn = document.getElementById("sync-now");
        btn.disabled = true;
        syncStatusEl.className = "sync-status";
        syncStatusEl.textContent = "Syncing with Google Contacts…";
        try {
          const result = await syncGoogle();
          lastSyncMessage =
            "Synced " + result.pulled + " contact" + (result.pulled === 1 ? "" : "s") +
            " from Google (" + result.created + " new, " + result.updated + " updated).";
          await renderList();
        } catch (err) {
          syncStatusEl.className = "sync-status sync-error";
          syncStatusEl.textContent = "Sync failed: " + err.message;
          btn.disabled = false;
        }
      });

      const countEl = document.getElementById("count");
      const listBody = document.getElementById("list-body");
      const resultSummary = document.getElementById("result-summary");
      const searchInput = document.getElementById("search-input");
      const searchClearBtn = document.getElementById("search-clear");
      const followupToggleBtn = document.getElementById("followup-toggle");

      function attachRowHandlers() {
        for (const tr of listBody.querySelectorAll("tbody tr")) {
          const id = tr.getAttribute("data-id");
          const go = () => navigate("#/contact/" + encodeURIComponent(id));
          tr.addEventListener("click", go);
          tr.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              go();
            }
          });
        }
      }

      function renderEmptyDb() {
        listBody.innerHTML =
          '<section class="empty-state" id="empty-state">' +
          '<span class="icon" aria-hidden="true">&#128101;</span>' +
          "<h2>No contacts yet</h2>" +
          "<p>Add the first person to your rolodex to see them here.</p>" +
          '<button id="add-empty">+ Add contact</button>' +
          "</section>";
        document.getElementById("add-empty").addEventListener("click", () => navigate("#/new"));
      }

      function renderEmptyResults() {
        listBody.innerHTML =
          '<section class="empty-state" id="empty-results-state">' +
          '<span class="icon" aria-hidden="true">&#128269;</span>' +
          "<h2>No matches</h2>" +
          "<p>Try a different name, organization, note, or tag.</p>" +
          "</section>";
      }

      // Third empty state: toggle is ON and nobody currently qualifies.
      // Reassuring tone, no "add contact" CTA — this is a good state to be
      // in, not a gap to fill. Distinct icon from both the empty-DB (person)
      // and empty-search-results (magnifying glass) states so the three are
      // never visually confusable.
      function renderEmptyFollowUp() {
        listBody.innerHTML =
          '<section class="empty-state" id="empty-followup-state">' +
          '<span class="icon" aria-hidden="true">&#10003;</span>' +
          "<h2>You're all caught up</h2>" +
          "<p>Nobody needs a follow-up right now. Check back later, or adjust your follow-up settings.</p>" +
          "</section>";
      }

      function renderRows(list) {
        if (list.length === 0) {
          renderEmptyResults();
          return;
        }
        listBody.innerHTML =
          '<table class="contacts" role="table">' +
          '<thead><tr>' +
          '<th scope="col">Name</th><th scope="col">Organization</th><th scope="col">Verdict</th><th scope="col">Next step</th>' +
          "</tr></thead>" +
          "<tbody>" +
          list.map(rowHtml).join("") +
          "</tbody></table>";
        attachRowHandlers();
      }

      let allContacts = [];
      let totalCount = 0;
      let searchDebounce = null;

      // Follow-up toggle state. `needsFollowUpContacts` is fetched once (in
      // parallel with the normal contacts fetch, below) so the button's count
      // label is accurate before the user ever clicks it; toggling ON reuses
      // that same snapshot rather than re-fetching, since nothing changes it
      // except a settings save (handled explicitly in wireSettingsPanel) or a
      // fresh renderList() (e.g. navigating away and back, or "Sync now").
      let followUpOn = false;
      let needsFollowUpContacts = null;

      function formatToggleLabel(count) {
        return count === null ? "Needs follow-up" : "Needs follow-up (" + count + ")";
      }

      function setToggleUi() {
        followupToggleBtn.setAttribute("aria-pressed", String(followUpOn));
        followupToggleBtn.classList.toggle("secondary", !followUpOn);
        followupToggleBtn.textContent = formatToggleLabel(
          needsFollowUpContacts ? needsFollowUpContacts.length : null,
        );
      }

      // Search-as-you-type (~250ms debounce), Enter for an immediate search,
      // Escape to clear + refocus — per the search-and-logging design brief.
      // Whitespace-only queries are treated as empty (don't hit the store);
      // an empty DB's own empty state always wins over a search's, since
      // there's nothing to search regardless of what's typed.
      //
      // Toggle + search compose rather than reset each other: the toggle
      // picks the "base list" search filters within (needs-follow-up vs. all
      // contacts), and search filters within whichever base is currently
      // active. Empty-state precedence (most fundamental first): empty DB >
      // toggle-ON-zero-results > search-zero-results.
      async function runSearch(rawQuery) {
        const trimmed = rawQuery.trim();
        searchClearBtn.hidden = trimmed === "";

        if (totalCount === 0) {
          resultSummary.textContent = "";
          renderEmptyDb();
          return;
        }

        const base = followUpOn ? needsFollowUpContacts || [] : allContacts;

        if (followUpOn && base.length === 0) {
          resultSummary.textContent = "";
          renderEmptyFollowUp();
          return;
        }

        if (!trimmed) {
          resultSummary.textContent = "";
          renderRows(base);
          return;
        }
        try {
          const results = await searchContacts(trimmed);
          let matched = results.map((r) => r.contact);
          if (followUpOn) {
            const baseIds = new Set(base.map((c) => c.id));
            matched = matched.filter((c) => baseIds.has(c.id));
          }
          resultSummary.textContent =
            "Showing " + matched.length + " of " + base.length + ' contacts for "' + trimmed + '"';
          renderRows(matched);
        } catch (err) {
          resultSummary.textContent = "Search failed: " + err.message;
          console.error(err);
        }
      }

      followupToggleBtn.addEventListener("click", async () => {
        followUpOn = !followUpOn;
        setToggleUi();
        if (followUpOn && needsFollowUpContacts === null) {
          // The parallel load-time fetch failed earlier — retry now rather
          // than silently showing an empty toggle-on list.
          try {
            needsFollowUpContacts = await getNeedsFollowUp();
            setToggleUi();
          } catch (err) {
            followUpOn = false;
            setToggleUi();
            resultSummary.textContent = "Couldn't load follow-ups: " + err.message;
            console.error(err);
            return;
          }
        }
        runSearch(searchInput.value);
      });

      searchInput.addEventListener("input", () => {
        clearTimeout(searchDebounce);
        const value = searchInput.value;
        searchDebounce = setTimeout(() => runSearch(value), 250);
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          clearTimeout(searchDebounce);
          runSearch(searchInput.value);
        } else if (e.key === "Escape") {
          searchInput.value = "";
          clearTimeout(searchDebounce);
          runSearch("");
          searchInput.focus();
        }
      });
      searchClearBtn.addEventListener("click", () => {
        searchInput.value = "";
        clearTimeout(searchDebounce);
        runSearch("");
        searchInput.focus();
      });

      try {
        // Fetched in parallel, not sequentially: the needs-follow-up count
        // must be accurate on the toggle button before the user ever clicks
        // it, and this avoids a second round-trip on the common
        // load-then-toggle path. A failure on the follow-up side (network
        // hiccup, etc.) shouldn't take down the whole list, so it's caught
        // independently and just leaves the count/toggle in its "unknown"
        // state (retried lazily on click — see the toggle's own handler).
        const [contacts, followUps] = await Promise.all([
          getContacts(),
          getNeedsFollowUp().catch((err) => {
            console.error(err);
            return null;
          }),
        ]);
        allContacts = contacts;
        totalCount = allContacts.length;
        needsFollowUpContacts = followUps;
        countEl.textContent = totalCount + " contact" + (totalCount === 1 ? "" : "s");
        setToggleUi();
        if (totalCount === 0) {
          renderEmptyDb();
          return;
        }
        renderRows(allContacts);
      } catch (err) {
        countEl.textContent = "Failed to load contacts";
        console.error(err);
      }

      // ---- Follow-up settings popover ------------------------------------
      // Structurally cloned from wireInteractionsPanel()'s open/close/focus
      // contract (empty wrapper when closed, form innerHTML when open, focus
      // moves to the first control on open and back to the toggle button on
      // any close path) — plus outside-click/Escape dismissal, since this is
      // a non-modal popover rather than an inline disclosure and needs its
      // own way to go away without a Cancel click. Nested here (rather than
      // a top-level function) so it can reach the toggle's followUpOn/
      // needsFollowUpContacts state and re-run runSearch()/setToggleUi()
      // after a save, per the design brief's post-save recommendation.
      function settingsFormHtml(windowDays, graceDays) {
        return (
          '<form class="log-interaction-form settings-panel" id="settings-form" aria-label="Follow-up settings" novalidate>' +
          '<div class="form-error-banner" id="settings-form-error" hidden></div>' +
          '<div class="form-field" id="settings-window-field">' +
          '<label for="settings-window">Follow-up window (days)</label>' +
          '<input type="number" id="settings-window" min="1" step="1" inputmode="numeric" ' +
          'value="' + escapeHtml(String(windowDays)) + '" aria-describedby="settings-window-error" />' +
          '<span class="field-error" id="settings-window-error" hidden>Enter a positive whole number.</span>' +
          "</div>" +
          '<div class="form-field" id="settings-grace-field">' +
          '<label for="settings-grace">Grace period (days)</label>' +
          '<input type="number" id="settings-grace" min="1" step="1" inputmode="numeric" ' +
          'value="' + escapeHtml(String(graceDays)) + '" aria-describedby="settings-grace-error" />' +
          '<span class="field-error" id="settings-grace-error" hidden>Enter a positive whole number.</span>' +
          "</div>" +
          '<div class="form-actions">' +
          '<button type="button" class="secondary" id="settings-cancel">Cancel</button>' +
          '<button type="submit" id="settings-save">Save</button>' +
          "</div>" +
          "</form>"
        );
      }

      function wireSettingsPanel() {
        const anchor = document.getElementById("settings-anchor");
        const toggleBtn = document.getElementById("settings-toggle");
        const wrap = document.getElementById("settings-panel-wrap");
        let panelOpen = false;

        function onDocumentMousedown(e) {
          if (panelOpen && !anchor.contains(e.target)) {
            // Prevent the browser's native default mousedown action (which
            // shifts focus to <body> for clicks on non-focusable elements)
            // from clobbering the explicit toggleBtn.focus() in closePanel().
            // That default action runs AFTER this synchronous handler
            // returns, so without preventDefault() here, focus would land on
            // <body> instead of the gear button.
            e.preventDefault();
            closePanel();
          }
        }
        function onDocumentKeydown(e) {
          if (panelOpen && e.key === "Escape") {
            e.preventDefault();
            closePanel();
          }
        }
        function onHashChange() {
          closePanel();
        }

        function closePanel() {
          if (!panelOpen) return;
          panelOpen = false;
          wrap.innerHTML = "";
          toggleBtn.setAttribute("aria-expanded", "false");
          document.removeEventListener("mousedown", onDocumentMousedown);
          document.removeEventListener("keydown", onDocumentKeydown);
          window.removeEventListener("hashchange", onHashChange);
          toggleBtn.focus();
        }

        function validatePositiveInt(input, fieldId, errorId) {
          const raw = input.value.trim();
          const n = Number(raw);
          const valid = raw !== "" && Number.isInteger(n) && n > 0;
          document.getElementById(fieldId).classList.toggle("invalid", !valid);
          document.getElementById(errorId).hidden = valid;
          if (valid) input.removeAttribute("aria-invalid");
          else input.setAttribute("aria-invalid", "true");
          return valid ? n : null;
        }

        function wireForm() {
          const form = document.getElementById("settings-form");
          const windowInput = document.getElementById("settings-window");
          const graceInput = document.getElementById("settings-grace");

          document.getElementById("settings-cancel").addEventListener("click", () => closePanel());

          form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const windowDays = validatePositiveInt(windowInput, "settings-window-field", "settings-window-error");
            const graceDays = validatePositiveInt(graceInput, "settings-grace-field", "settings-grace-error");
            if (windowDays === null || graceDays === null) {
              (windowDays === null ? windowInput : graceInput).focus();
              return;
            }

            const errorBanner = document.getElementById("settings-form-error");
            const saveBtn = document.getElementById("settings-save");
            saveBtn.disabled = true;
            try {
              await putFollowUpSettings({ windowDays, graceDays });
              errorBanner.hidden = true;
              closePanel();
              // Recommendation beyond the bare acceptance criteria: if the
              // follow-up toggle is currently ON, the visible list was built
              // from the OLD window/grace values — re-fetch immediately so it
              // (and the count badge) reflect what was just saved, instead of
              // waiting for the next toggle click.
              if (followUpOn) {
                try {
                  needsFollowUpContacts = await getNeedsFollowUp();
                } catch (err) {
                  console.error(err);
                }
                setToggleUi();
                runSearch(searchInput.value);
              }
            } catch (err) {
              // Save fails: keep the panel open with an inline error banner,
              // preserving the user's edits (matches the log-interaction
              // form's failure behavior).
              errorBanner.hidden = false;
              errorBanner.textContent = "Couldn't save: " + err.message;
            } finally {
              saveBtn.disabled = false;
            }
          });
        }

        async function openPanel() {
          panelOpen = true;
          toggleBtn.setAttribute("aria-expanded", "true");
          let current = { windowDays: 30, graceDays: 14 };
          try {
            current = await getFollowUpSettings();
          } catch (err) {
            console.error(err);
          }
          wrap.innerHTML = settingsFormHtml(current.windowDays, current.graceDays);
          wireForm();
          document.getElementById("settings-window").focus();
          document.addEventListener("mousedown", onDocumentMousedown);
          document.addEventListener("keydown", onDocumentKeydown);
          window.addEventListener("hashchange", onHashChange);
        }

        toggleBtn.addEventListener("click", () => {
          if (panelOpen) closePanel();
          else openPanel();
        });
      }
    }

    function rowHtml(c) {
      const meta = verdictMeta(c.verdict);
      const next = c.nextStep || "";
      const truncated = next.length > 40 ? next.slice(0, 40) + "…" : next;
      return (
        '<tr tabindex="0" data-id="' + escapeHtml(c.id) + '">' +
        "<td>" + escapeHtml(c.name) + "</td>" +
        "<td>" + escapeHtml(c.org || "") + "</td>" +
        '<td><span class="verdict-badge verdict-' + escapeHtml(c.verdict) + '">' +
        meta.icon + " " + meta.label +
        "</span></td>" +
        '<td class="next-step" title="' + escapeHtml(next) + '">' + escapeHtml(truncated) + "</td>" +
        "</tr>"
      );
    }

    // ---- Detail view ----------------------------------------------------------
    async function renderDetail(id) {
      setTopbar({
        left: '<button class="back-link" id="back-link">&larr; Back to contacts</button>',
        right: '<button id="edit-top">Edit</button>',
      });
      document.getElementById("back-link").addEventListener("click", () => navigate("#/"));

      let contact;
      try {
        contact = await getContact(id);
      } catch (err) {
        content.innerHTML =
          '<p class="not-found-banner">Contact not found — it may have been removed.</p>';
        navigate("#/");
        return;
      }

      let history = [];
      try {
        history = await getInteractions(id);
      } catch (err) {
        console.error(err);
      }

      document.getElementById("edit-top").addEventListener("click", () =>
        navigate("#/contact/" + encodeURIComponent(id) + "/edit"),
      );

      const tags = contact.tags || [];
      content.innerHTML =
        '<div class="detail-header">' +
        "<h1>" + escapeHtml(contact.name) + "</h1>" +
        '<p class="subordinate">' + escapeHtml([contact.role, contact.org].filter(Boolean).join(" · ")) + "</p>" +
        "</div>" +
        '<div class="detail-columns">' +
        '<div class="col">' +
        "<h2>Contact info</h2>" +
        fieldRow("Email", contact.email) +
        fieldRow("Phone", contact.phone) +
        fieldRow("Met", contact.met) +
        "<h2>About</h2>" +
        fieldRow("What", contact.what) +
        fieldRow("Angle", contact.angle) +
        "<h2>Tags</h2>" +
        (tags.length
          ? '<ul class="tag-list" aria-label="Tags: ' + escapeHtml(tags.join(", ")) + '">' +
            tags.map((t) => "<li>" + escapeHtml(t) + "</li>").join("") +
            "</ul>"
          : '<p class="value" style="color:var(--muted)">No tags</p>') +
        "</div>" +
        '<div class="col">' +
        '<h2 id="verdict-heading">Verdict</h2>' +
        '<div class="verdict-picker" role="radiogroup" aria-labelledby="verdict-heading" id="verdict-picker"></div>' +
        '<div class="autosave-status" id="verdict-status" aria-live="polite"></div>' +
        '<div class="next-step-field">' +
        '<label for="next-step-input">Next step</label>' +
        '<input id="next-step-input" type="text" value="' + escapeHtml(contact.nextStep || "") + '" />' +
        '<div class="autosave-status" id="next-step-status" aria-live="polite"></div>' +
        "</div>" +
        '<div class="interactions-panel">' +
        '<div class="interactions-header">' +
        '<h2 id="interactions-heading">' + (history.length ? "Interactions (" + history.length + ")" : "Interactions") + "</h2>" +
        '<button type="button" class="secondary" id="log-interaction-toggle" aria-expanded="false" aria-controls="log-interaction-form-wrap">+ Log interaction</button>' +
        "</div>" +
        '<div id="log-interaction-form-wrap"></div>' +
        '<div id="interaction-history-wrap"></div>' +
        "</div>" +
        "</div>" +
        "</div>";

      wireVerdictPicker(contact);
      wireNextStepField(contact);
      wireInteractionsPanel(contact, history);
    }

    function fieldRow(label, value) {
      if (!value) return "";
      return (
        '<p class="field-row"><span class="label">' + escapeHtml(label) + ":</span> " +
        '<span class="value">' + escapeHtml(value) + "</span></p>"
      );
    }

    function wireVerdictPicker(contact) {
      const picker = document.getElementById("verdict-picker");
      const status = document.getElementById("verdict-status");
      let current = contact.verdict;

      function draw() {
        picker.innerHTML = VERDICTS.map(
          (v) =>
            '<span role="radio" tabindex="' + (v.value === current ? "0" : "-1") + '" ' +
            'aria-checked="' + (v.value === current ? "true" : "false") + '" ' +
            'data-value="' + v.value + '">' + v.icon + " " + v.label + "</span>",
        ).join("");
      }
      draw();

      async function choose(value) {
        if (value === current) return;
        const previous = current;
        current = value;
        draw();
        picker.querySelector('[data-value="' + value + '"]').focus();
        status.textContent = "Saving…";
        try {
          await patchVerdict(contact.id, value);
          status.textContent = "Saved";
          setTimeout(() => { if (status.textContent === "Saved") status.textContent = ""; }, 2000);
        } catch (err) {
          current = previous;
          draw();
          status.textContent = "Failed to save: " + err.message;
        }
      }

      picker.addEventListener("click", (e) => {
        const el = e.target.closest('[role="radio"]');
        if (el) choose(el.getAttribute("data-value"));
      });
      picker.addEventListener("keydown", (e) => {
        const idx = VERDICTS.findIndex((v) => v.value === current);
        if (e.key === "ArrowRight" || e.key === "ArrowDown") {
          e.preventDefault();
          choose(VERDICTS[(idx + 1) % VERDICTS.length].value);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault();
          choose(VERDICTS[(idx - 1 + VERDICTS.length) % VERDICTS.length].value);
        }
      });
    }

    function wireNextStepField(contact) {
      const input = document.getElementById("next-step-input");
      const status = document.getElementById("next-step-status");
      let lastSaved = contact.nextStep || "";

      async function commit() {
        const value = input.value;
        if (value === lastSaved) return;
        status.textContent = "Saving…";
        try {
          await patchNextStep(contact.id, value);
          lastSaved = value;
          status.textContent = "Saved";
          setTimeout(() => { if (status.textContent === "Saved") status.textContent = ""; }, 2000);
        } catch (err) {
          status.textContent = "Failed to save: " + err.message;
        }
      }

      input.addEventListener("blur", commit);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          input.blur();
        } else if (e.key === "Escape") {
          input.value = lastSaved;
          input.blur();
        }
      });
    }

    // ---- Log-interaction disclosure + history --------------------------------
    const HISTORY_PAGE_SIZE = 5;

    function interactionRowHtml(i) {
      const meta = channelMeta(i.channel);
      return (
        '<li class="interaction-row">' +
        '<span class="channel-badge">' + meta.icon + " " + escapeHtml(meta.label) + "</span>" +
        '<div class="interaction-body">' +
        '<div class="interaction-date">' + escapeHtml(formatInteractionDate(i.at)) + "</div>" +
        '<div class="interaction-note">' + escapeHtml(i.note) + "</div>" +
        "</div>" +
        "</li>"
      );
    }

    function logInteractionFormHtml() {
      return (
        '<form class="log-interaction-form" id="log-interaction-form" aria-labelledby="interactions-heading" novalidate>' +
        '<div class="form-error-banner" id="log-form-error" hidden></div>' +
        "<fieldset>" +
        '<legend id="log-channel-legend">Channel</legend>' +
        '<div class="channel-picker" role="radiogroup" aria-labelledby="log-channel-legend">' +
        CHANNELS.map(
          (c) =>
            '<label><input type="radio" name="log-channel" value="' + c.value + '"' +
            (c.value === "other" ? " checked" : "") + " /> <span>" + c.icon + " " + escapeHtml(c.label) + "</span></label>",
        ).join("") +
        "</div>" +
        "</fieldset>" +
        '<div class="form-field">' +
        '<label for="log-date">Date</label>' +
        '<input type="date" id="log-date" value="' + todayIso() + '" />' +
        "</div>" +
        '<div class="form-field" id="log-note-field">' +
        '<label for="log-note">Note <span class="required" aria-hidden="true">*</span></label>' +
        '<textarea id="log-note" required aria-required="true" aria-describedby="log-note-error"></textarea>' +
        '<span class="field-error" id="log-note-error" hidden>Note is required.</span>' +
        "</div>" +
        '<div class="form-actions">' +
        '<button type="button" class="secondary" id="log-cancel">Cancel</button>' +
        '<button type="submit" id="log-save">Save</button>' +
        "</div>" +
        "</form>"
      );
    }

    function wireInteractionsPanel(contact, initialHistory) {
      let history = initialHistory.slice();
      let expanded = false;
      let formOpen = false;

      const heading = document.getElementById("interactions-heading");
      const toggleBtn = document.getElementById("log-interaction-toggle");
      const formWrap = document.getElementById("log-interaction-form-wrap");
      const historyWrap = document.getElementById("interaction-history-wrap");

      function updateHeading() {
        heading.textContent = history.length ? "Interactions (" + history.length + ")" : "Interactions";
      }

      function renderHistory() {
        if (history.length === 0) {
          historyWrap.innerHTML =
            '<p class="empty-history">No interactions logged yet. Record your first touchpoint above.</p>';
          return;
        }
        const visible = expanded ? history : history.slice(0, HISTORY_PAGE_SIZE);
        const remaining = history.length - visible.length;
        historyWrap.innerHTML =
          '<ul class="interaction-history">' + visible.map(interactionRowHtml).join("") + "</ul>" +
          (remaining > 0
            ? '<button type="button" class="show-more-link" id="show-more-interactions">Show ' + remaining + " more</button>"
            : "");
        const showMoreBtn = document.getElementById("show-more-interactions");
        if (showMoreBtn) {
          showMoreBtn.addEventListener("click", () => {
            expanded = true;
            renderHistory();
          });
        }
      }

      function wireForm() {
        const form = document.getElementById("log-interaction-form");
        const noteEl = document.getElementById("log-note");

        document.getElementById("log-cancel").addEventListener("click", () => closeForm());

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const noteField = document.getElementById("log-note-field");
          const noteError = document.getElementById("log-note-error");
          const note = noteEl.value.trim();
          if (!note) {
            noteField.classList.add("invalid");
            noteEl.setAttribute("aria-invalid", "true");
            noteError.hidden = false;
            noteEl.focus();
            return;
          }
          noteField.classList.remove("invalid");
          noteEl.removeAttribute("aria-invalid");
          noteError.hidden = true;

          const channelEl = form.querySelector('input[name="log-channel"]:checked');
          const dateEl = document.getElementById("log-date");
          const payload = {
            note,
            channel: channelEl ? channelEl.value : "other",
            at: dateEl.value || todayIso(),
          };

          const errorBanner = document.getElementById("log-form-error");
          const saveBtn = document.getElementById("log-save");
          saveBtn.disabled = true;
          try {
            const created = await postInteraction(contact.id, payload);
            errorBanner.hidden = true;
            history = [created, ...history];
            updateHeading();
            renderHistory();
            // Success: form clears and stays open (supports logging two
            // things back-to-back) — per the design brief, NOT collapsed.
            noteEl.value = "";
            dateEl.value = todayIso();
            const otherRadio = form.querySelector('input[name="log-channel"][value="other"]');
            if (otherRadio) otherRadio.checked = true;
            noteEl.focus();
          } catch (err) {
            // Save fails: inline error banner above the form, contents preserved.
            errorBanner.hidden = false;
            errorBanner.textContent = "Couldn't save: " + err.message;
          } finally {
            saveBtn.disabled = false;
          }
        });

        // Enter inside the (single-line) channel/date controls must not
        // submit prematurely — browsers already withhold implicit submit for
        // radio/date inputs, so nothing extra is needed there. Enter inside
        // the note textarea inserts a newline (native behavior); Cmd/Ctrl+Enter
        // is the explicit submit shortcut.
        noteEl.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
            e.preventDefault();
            form.requestSubmit();
          }
        });
      }

      function openForm() {
        formOpen = true;
        toggleBtn.setAttribute("aria-expanded", "true");
        toggleBtn.textContent = "Cancel";
        formWrap.innerHTML = logInteractionFormHtml();
        wireForm();
        const firstControl = formWrap.querySelector('input[type="radio"]');
        if (firstControl) firstControl.focus();
      }

      function closeForm() {
        formOpen = false;
        formWrap.innerHTML = "";
        toggleBtn.setAttribute("aria-expanded", "false");
        toggleBtn.textContent = "+ Log interaction";
        toggleBtn.focus();
      }

      toggleBtn.addEventListener("click", () => {
        if (formOpen) closeForm();
        else openForm();
      });

      renderHistory();
    }

    // ---- Add/Edit form ----------------------------------------------------------
    async function renderForm(mode, id) {
      let existing = null;
      if (mode === "edit") {
        try {
          existing = await getContact(id);
        } catch (err) {
          content.innerHTML = '<p class="not-found-banner">Contact not found — it may have been removed.</p>';
          navigate("#/");
          return;
        }
      }
      const title = mode === "edit" ? "Edit contact" : "Add contact";
      const cancelTarget = mode === "edit" ? "#/contact/" + encodeURIComponent(id) : "#/";

      setTopbar({
        left: '<button class="cancel-link" id="cancel-top">Cancel</button><span class="brand">' + title + "</span>",
        right: '<button id="save-top" form="contact-form">Save</button>',
      });

      const v = existing || {};
      const tags = v.tags || [];

      content.innerHTML =
        '<form class="contact-form" id="contact-form" novalidate>' +
        '<div class="form-error-banner" id="form-error" hidden></div>' +

        "<fieldset>" +
        "<legend>Identity</legend>" +
        '<div class="form-field" id="name-field">' +
        '<label for="f-name">Name <span class="required" aria-hidden="true">*</span></label>' +
        '<input id="f-name" name="name" type="text" aria-required="true" value="' + escapeHtml(v.name || "") + '" />' +
        '<span class="field-error" id="name-error" hidden>Name is required.</span>' +
        "</div>" +
        '<div class="form-grid">' +
        '<div class="form-field"><label for="f-org">Organization</label><input id="f-org" type="text" value="' + escapeHtml(v.org || "") + '" /></div>' +
        '<div class="form-field"><label for="f-role">Role</label><input id="f-role" type="text" value="' + escapeHtml(v.role || "") + '" /></div>' +
        "</div>" +
        "</fieldset>" +

        "<fieldset>" +
        "<legend>Contact info</legend>" +
        '<div class="form-grid">' +
        '<div class="form-field"><label for="f-email">Email</label><input id="f-email" type="email" value="' + escapeHtml(v.email || "") + '" /></div>' +
        '<div class="form-field"><label for="f-phone">Phone</label><input id="f-phone" type="tel" value="' + escapeHtml(v.phone || "") + '" /></div>' +
        "</div>" +
        "</fieldset>" +

        "<fieldset>" +
        "<legend>Context</legend>" +
        '<div class="form-field"><label for="f-met">Met</label><input id="f-met" type="text" value="' + escapeHtml(v.met || "") + '" /></div>' +
        '<div class="form-field"><label for="f-what">What</label><textarea id="f-what">' + escapeHtml(v.what || "") + "</textarea></div>" +
        '<div class="form-field"><label for="f-angle">Angle</label><textarea id="f-angle">' + escapeHtml(v.angle || "") + "</textarea></div>" +
        "</fieldset>" +

        "<fieldset>" +
        '<legend>Classification</legend>' +
        '<div class="form-field">' +
        '<span id="verdict-legend">Verdict</span>' +
        '<div class="radio-group" role="radiogroup" aria-labelledby="verdict-legend">' +
        VERDICTS.map(
          (opt) =>
            '<label><input type="radio" name="verdict" value="' + opt.value + '"' +
            ((v.verdict || "none") === opt.value ? " checked" : "") +
            " /> " + opt.icon + " " + opt.label + "</label>",
        ).join("") +
        "</div>" +
        "</div>" +
        '<div class="form-field">' +
        '<label for="f-tag-input">Tags</label>' +
        '<div class="chip-input-wrap" id="chip-wrap">' +
        tags.map(chipHtml).join("") +
        '<input id="f-tag-input" type="text" placeholder="Add a tag…" />' +
        "</div>" +
        "</div>" +
        "</fieldset>" +

        "<fieldset>" +
        "<legend>Next step</legend>" +
        '<div class="form-field"><label for="f-next-step">Next step</label><input id="f-next-step" type="text" value="' + escapeHtml(v.nextStep || "") + '" /></div>' +
        "</fieldset>" +

        '<div class="form-footer">' +
        '<button type="button" class="secondary" id="cancel-bottom">Cancel</button>' +
        '<button type="submit">Save</button>' +
        "</div>" +
        "</form>";

      let dirty = false;
      content.querySelectorAll("input, textarea").forEach((el) => {
        el.addEventListener("input", () => { dirty = true; });
      });

      function goCancel() {
        if (dirty && !confirm("Discard changes?")) return;
        navigate(cancelTarget);
      }
      document.getElementById("cancel-top").addEventListener("click", goCancel);
      document.getElementById("cancel-bottom").addEventListener("click", goCancel);

      // Tags chip input
      let tagValues = tags.slice();
      const chipWrap = document.getElementById("chip-wrap");
      const tagInput = document.getElementById("f-tag-input");
      function redrawChips() {
        chipWrap.querySelectorAll(".chip").forEach((c) => c.remove());
        tagValues.forEach((t) => {
          tagInput.insertAdjacentHTML("beforebegin", chipHtml(t));
        });
        chipWrap.querySelectorAll(".chip button").forEach((btn) => {
          btn.addEventListener("click", () => {
            const tag = btn.getAttribute("data-tag");
            tagValues = tagValues.filter((t) => t !== tag);
            dirty = true;
            redrawChips();
          });
        });
      }
      redrawChips();
      tagInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          const val = tagInput.value.trim();
          if (val && !tagValues.includes(val)) {
            tagValues.push(val);
            dirty = true;
            redrawChips();
          }
          tagInput.value = "";
        } else if (e.key === "Backspace" && tagInput.value === "" && tagValues.length) {
          tagValues.pop();
          dirty = true;
          redrawChips();
        }
      });

      const form = document.getElementById("contact-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const nameEl = document.getElementById("f-name");
        const nameField = document.getElementById("name-field");
        const nameError = document.getElementById("name-error");
        const name = nameEl.value.trim();
        if (!name) {
          nameField.classList.add("invalid");
          nameError.hidden = false;
          nameEl.focus();
          return;
        }
        nameField.classList.remove("invalid");
        nameError.hidden = true;

        const verdictEl = form.querySelector('input[name="verdict"]:checked');
        const payload = {
          name,
          org: document.getElementById("f-org").value.trim() || undefined,
          role: document.getElementById("f-role").value.trim() || undefined,
          email: document.getElementById("f-email").value.trim() || undefined,
          phone: document.getElementById("f-phone").value.trim() || undefined,
          met: document.getElementById("f-met").value.trim() || undefined,
          what: document.getElementById("f-what").value.trim() || undefined,
          angle: document.getElementById("f-angle").value.trim() || undefined,
          verdict: verdictEl ? verdictEl.value : "none",
          nextStep: document.getElementById("f-next-step").value.trim() || undefined,
          tags: tagValues.length ? tagValues : undefined,
        };
        if (existing) {
          payload.id = existing.id;
          payload.createdAt = existing.createdAt;
          payload.googleResourceName = existing.googleResourceName;
        }

        const errorBanner = document.getElementById("form-error");
        try {
          const saved = await saveContact(payload);
          dirty = false;
          navigate("#/contact/" + encodeURIComponent(saved.id));
        } catch (err) {
          errorBanner.hidden = false;
          errorBanner.textContent = "Couldn't save: " + err.message;
        }
      });
    }

    function chipHtml(tag) {
      return (
        '<span class="chip">' + escapeHtml(tag) +
        '<button type="button" data-tag="' + escapeHtml(tag) + '" aria-label="Remove tag: ' + escapeHtml(tag) + '">✕</button>' +
        "</span>"
      );
    }

    // ---- boot ----------------------------------------------------------
    // render() (via renderList/renderDetail/renderForm) always replaces the
    // topbar's contents and wires its own listeners, so nothing needs to be
    // bound to the static markup's button here.
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
