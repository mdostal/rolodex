<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rolodex</title>
  <style>
    :root {
      color-scheme: light dark;
      --border: #d9d9df;
      --muted: #6b6b76;
      --bg: #fff;
      --fg: #1b1b1f;
      --accent: #2f5ed9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      min-width: 960px;
    }
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
    }
    .topbar .brand { font-weight: 600; font-size: 1rem; }
    button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      min-height: 32px;
    }
    button:disabled { background: #c9c9d1; border-color: #c9c9d1; cursor: not-allowed; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .page-header h1 { font-size: 1.5rem; margin: 0 0 4px; }
    #count { color: var(--muted); font-size: 0.95rem; }
    .search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .search input {
      min-width: 240px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
    }
    .empty-state {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; }
    .empty-state h2 { margin: 0; color: var(--fg); font-size: 1.1rem; }
    .empty-state p { margin: 0 0 8px; max-width: 32ch; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">rolodex</span>
    <button id="add-top" disabled title="Coming in saf-02">+ Add contact</button>
  </header>

  <main>
    <div class="page-header">
      <div>
        <h1>Contacts</h1>
        <div id="count" aria-live="polite">Loading…</div>
      </div>
      <div class="search">
        <label for="search-input">Search contacts</label>
        <input id="search-input" type="search" placeholder="Search (coming soon)" disabled />
      </div>
    </div>

    <div id="content">
      <section class="empty-state" id="empty-state" hidden>
        <span class="icon" aria-hidden="true">&#128101;</span>
        <h2>No contacts yet</h2>
        <p>Add the first person to your rolodex to see them here.</p>
        <button id="add-empty" disabled title="Coming in saf-02">+ Add contact</button>
      </section>
    </div>
  </main>

  <script>
    async function loadContacts() {
      const countEl = document.getElementById("count");
      const emptyState = document.getElementById("empty-state");
      try {
        const res = await fetch("/api/contacts");
        if (!res.ok) throw new Error("request failed: " + res.status);
        const contacts = await res.json();
        countEl.textContent = contacts.length + " contact" + (contacts.length === 1 ? "" : "s");
        emptyState.hidden = contacts.length !== 0;
        // Populated rows are saf-02's scope; this story only proves the live
        // count and the empty state render from the real store.
      } catch (err) {
        countEl.textContent = "Failed to load contacts";
        console.error(err);
      }
    }
    loadContacts();
  </script>
</body>
</html>
