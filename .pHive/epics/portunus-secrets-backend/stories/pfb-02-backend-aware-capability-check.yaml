    change: "checkSecretsCapability gains a backend parameter; dispatch to classifyPortunusError vs classifyKeychainError and the right backend label accordingly"
  - file: src/lib/secrets-adapter.ts
    change: "CreateSecretsAdapterOptions gains backend?: 'keychain' | 'portunus'; withInMemoryFallback's warning text becomes backend-aware"
  - file: src/shell/server.ts
    change: "capability-check route reads { backend } from the request body and passes it through"

