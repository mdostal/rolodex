design_decisions:
  - decision: "get() validates tempfile path provenance (absolute + under os.tmpdir() + regular file via lstat, not stat) before reading, not just format"
    rationale: "Grill finding F10: a printed 'looks like a path' string isn't proof of provenance — a buggy or malicious process could point rolodex at reading/deleting an arbitrary file it has access to. TOCTOU-aware: symlink check specifically closes the swap-between-print-and-read risk."
  - decision: "set()'s failure mode (drop succeeds, state-enable fails) throws without rolling back"
    rationale: "A rollback call is itself a new failure surface. A dropped-but-disabled entry is inert, not actively harmful — documented accepted behavior, not a silent gap. Whether a RETRY behaves safely is a required empirical check, not assumed."
  - decision: "isPortunusAvailable() reuses the exact timeout/abort mechanism from secrets-check.ts rather than a plain execFile timeout option"
    rationale: "This codebase already has direct, documented experience (PROBE_STEP_TIMEOUT_MS's own docstring) with a CLI hanging on an interactive prompt instead of failing fast. Reusing the proven mechanism instead of a vaguer 'or equivalent' is a grill-flagged correction (F12)."

risks:
  - severity: medium
    description: "First shell-out-to-a-different-external-program backend in this codebase, with a materially different write/read contract than Keychain — several real behavioral questions were explicitly deferred to this story's required empirical checks rather than resolved in the design doc"
    mitigation: "Acceptance criteria above name each deferred question explicitly and require documented, real-CLI verification — not satisfied by a mock/fake alone"

