name: contacts-memory
title: "Rolodex as Pantheon's contacts memory: scoped cards, cross-scope links, the `contacts` slot"
description: |
  Rolodex becomes the default implementation of a new generic `contacts` slot. Cards live in
  `client:*` or `user:*` scopes enforced in SQL; links cross scopes and are visible only when both
  ends are. Agents reach it through core-api with their Multica task token binding them to one
  client (gated by the cm-00 spike). The standalone desktop app keeps working unchanged.
target_codebase: /pantheon/code/rolodex
also_touches: [mdostal/pantheon-v2, mdostal/janus]
methodology: tdd
version_bump: minor
sidecar_retention: committed
git_flow:
  base_branch: dev
  branch_strategy: per-story
planning_team:
  matched_tags: [security, data-model, cross-repo, ui]
  roster: [researcher, technical-writer, tpm-grill, architect]
  confidence: medium
  notes: "Planned orchestrator-local on Opus (fable unavailable); grill run by an independent subagent, round 1 unresolved_count 25, all answered in design-discussion revision 1."
source: "operator, 2026-11-20: rolodex as a solid plugin, its own memory like mnemosyne, purely contacts, workspace/user scoped, with connections"
