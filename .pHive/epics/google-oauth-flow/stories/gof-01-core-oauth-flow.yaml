design_decisions:
  - decision: "redirect_uri is the bare http://127.0.0.1:<port> with no path suffix"
    rationale: "Only this bare form was confirmed against Google's current loopback-flow docs during research; an earlier draft's /callback suffix was an unconfirmed addition, caught and removed during the grill adversarial pass."
  - decision: "Non-matching requests (wrong path, bad state) never close the listener or settle the flow"
    rationale: "Grill finding S1: settling on ANY request (e.g. a stray /favicon.ico probe) would let an unrelated local request kill the real Google callback before it arrives."
  - decision: "Callback HTML response is always one of a small fixed set of hardcoded strings, never interpolates a query param"
    rationale: "Grill finding S3: closes the reflected-content risk entirely by construction rather than relying on escaping untrusted input."
  - decision: "The state nonce's brief visibility in the spawned open process's argv (via ps) is an accepted, documented risk, not silently ignored"
    rationale: "Grill finding S2: this app's threat model is already single-user/local-machine (same class of exposure the OS keychain CLI calls already have); mitigated by the nonce being single-use and short-lived."
  - decision: "google-sync.ts's GOOGLE_OAUTH_TOKEN_KEY becomes exported (a real import), unlike GOOGLE_OAUTH_CLIENT_KEY's deliberate duplication across the src/lib -> src/shell boundary"
    rationale: "The duplication convention exists specifically to keep src/lib independent of src/shell. google-oauth-flow.ts lives in src/lib alongside google-sync.ts — a same-package import, not a cross-boundary one — so the rationale for duplication doesn't apply here."

risks:
  - severity: medium
    description: "First real local HTTP listener + real OAuth exchange in the codebase — genuinely new pattern, not integration over already-tested code"
    mitigation: "Explicit timeout, AbortSignal, concurrency guard, and a listener that only ever settles on a verified legitimate callback — all covered by acceptance criteria above"
  - severity: low
    description: "state nonce briefly visible via ps to other local accounts on the same machine"
    mitigation: "Accepted risk under this app's single-user local-machine threat model; nonce is single-use and short-lived (documented in design-discussion.md §4)"

