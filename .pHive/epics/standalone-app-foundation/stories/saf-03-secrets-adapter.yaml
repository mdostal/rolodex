id: saf-03-secrets-adapter
epic: standalone-app-foundation
title: Secrets Adapter — interface, OS keychain implementation, CI fake
status: in_progress
complexity: medium
methodology: classic
depends_on: [saf-01-shell-store-bridge]

description: |
  Build a pluggable secrets-storage layer, mirroring the existing GoogleSync
  interface+factory pattern (google-sync.ts:24-42): a SecretsAdapter
  interface, one real OS-keychain implementation, and an in-memory fake
  implementation shipped alongside it (added after security-reviewer review —
  headless CI can't reach a real OS keychain, so the fake is what CI actually
  exercises; without it, saf-04's credential-handling tests would be silently
  uncovered).

  Do NOT use `keytar` (revised after architect review — it's archived/
  unmaintained and, as a native module, prone to Electron ABI-rebuild
  breakage). If saf-01 chose Electron, prefer Electron's built-in
  `safeStorage` API. For other shells, use the platform-native credential
  binding appropriate to that runtime.

  This adapter stores ONLY this instance's Google OAuth credentials — no
  session/login use exists anywhere in this app (login/logout was descoped
  entirely at the H/V review gate; single-user-per-instance).

  Part of the pre-exec security escalation logged in
  .pHive/cycle-state/standalone-app-foundation.yaml (architect, H/V gate) and
  tracked as structured-outline.md Risk Registry row 10 / Decision 7: a
  security-focused review of this story's design should happen before it and
  saf-04 are marked done.

acceptance_criteria:
  - "Given a key and value, when set() then get() is called via the fake adapter, then the value round-trips (CI-verified)"
  - "Given a key and value, when set() then get() is called via the real OS-keychain adapter, then the value round-trips (manual/local-only verification, documented as a required pre-release check, not a CI gate)"
  - "Given no chosen backend supports keytar, then keytar is not a dependency anywhere in package.json"

steps:
  - id: research
    description: Confirm saf-01's shell choice to select the correct OS-keychain library/API (safeStorage if Electron, otherwise the platform-native binding)
    agent: researcher
  - id: implement
    description: Implement the SecretsAdapter interface, factory, OS-keychain implementation, and in-memory fake implementation
    agent: developer
    depends_on: [research]
  - id: test
    description: Write and pass the fake-adapter round-trip unit test; perform and document the manual real-keychain round-trip check
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness, convention compliance, and confirm keytar is not used
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

