design_decisions:
  - decision: "SecretsAdapter interface with a swappable factory, not a hardcoded keychain call"
    rationale: "Owner explicitly requested this at the design-discussion gate — lets a future OSS contribution add a Portunus adapter (or any other secret manager) without touching Store or the UI."
  - decision: "Ship a fake adapter alongside the real one"
    rationale: "security-reviewer review at the H/V gate: CI cannot reach a real OS keychain headlessly; the fake is what CI actually exercises."

risks:
  - severity: medium
    description: OS-keychain library regression not caught by CI (fake adapter only exercised in CI)
    mitigation: "Manual pre-release keychain round-trip check documented as required, not optional (structured-outline.md Risk 2)"

