design_decisions:
  - decision: "Toggle and search compose (intersection), never reset each other"
    rationale: "Matches user mental model of two active filters; decided during design-discussion review."
  - decision: "Settings panel is scoped to exactly two fields, not the full deferred settings screen"
    rationale: "Keeps this epic Small; the fuller settings screen (Google reconnect, DB location) stays a separate future epic per vertical-plan.md's Deferred Items."

risks:
