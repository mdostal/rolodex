    description: "Toggle integration touches existing render/search data-flow in index.html more than a typical additive UI change (tpm review finding from design-discussion gate)"
    mitigation: "ui-design step produces a concrete brief for the three-empty-state + toggle-state behavior before implementation starts, so the developer isn't improvising the data-flow contract"

cross_cutting:
