code_examples:
  - title: Existing stub contract to satisfy
    file: src/lib/store.ts
    snippet: |
      /** Contacts with a nextStep set and no recent interaction — "don't let them go cold". */
      needsFollowUp(_withinDays = 30): Contact[] { throw new Error("not implemented"); }
  - title: Existing 400-validation pattern to mirror (verdict enum)
    file: src/shell/server.ts
    snippet: |
      const VALID_VERDICTS = ["strong", "watch", "referral-only", "pass", "none"];
      function isValidVerdict(v: unknown): v is Contact["verdict"] {
        return typeof v === "string" && (VALID_VERDICTS as string[]).includes(v);
      }

design_decisions:
  - decision: "Grace period and follow-up window are configurable settings, not hardcoded constants"
    rationale: "Owner directive during design-discussion review: judgment calls like these should be user-editable, not baked in."
  - decision: "Shipped defaults (windowDays: 30, graceDays: 14) set by quorum (median) of 5 differing-opinion personas, not a single planner guess"
    rationale: "Owner directive: 'make your defaults the quorum of a group of 5 personas that differ in opinions.' Full breakdown in design-discussion.md §7."
  - decision: "Never-touched contacts sort as the oldest-possible value (above any real last-interaction date)"
    rationale: "Grill finding H1: 'never followed up' is more urgent than 'it's been a while.'"

risks:
  - severity: low
    description: SQL correctness for the "most recent interaction per contact" comparison
    mitigation: "Covered by the acceptance criteria's explicit test scenarios; use whichever of correlated-subquery/LEFT JOIN+GROUP BY is clearest given node:sqlite's actual support (confirm during research step)"

cross_cutting:
  - concern: documentation
    action: "New settings table and needsFollowUp() behavior should be noted in docs/ARCHITECTURE.md's data model section — bundle into fu-02 or a small follow-up, not required to block this story"

