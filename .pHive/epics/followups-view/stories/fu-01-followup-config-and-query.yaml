id: fu-01-followup-config-and-query
epic: followups-view
title: Follow-up config (settings table) + real needsFollowUp() query
status: in_progress
complexity: medium
methodology: classic
depends_on: []

description: |
  Implement Store.needsFollowUp() for real (currently a stub that throws
  "not implemented" — the last unimplemented piece of the original Store
  interface), backed by a new configurable settings mechanism rather than
  hardcoded numbers. A contact needs follow-up when it has a nextStep set,
  is older than the configured grace period, and has no interaction within
  the configured window (or no interaction at all).

  Adds a new `settings` key-value table (additive, no changes to existing
  tables), Store.getSetting/setSetting plus typed getFollowUpConfig/
  setFollowUpConfig wrappers, and two new API routes: GET
  /api/contacts/needs-follow-up (optional withinDays/graceDays query-param
  overrides) and GET/PUT /api/settings/follow-up.

  Defaults are seeded lazily on first read (windowDays: 30, graceDays: 14) —
  set by a quorum (median) of 5 differing-opinion personas during planning,
  not a single guess. See design-discussion.md §7 for the full breakdown.

acceptance_criteria:
  - "Given a contact with a nextStep set, no interactions, and older than the grace period, when needsFollowUp() is called, then it is included in the result"
  - "Given a contact with a nextStep set and an interaction logged within the configured window, when needsFollowUp() is called, then it is excluded"
  - "Given a contact with no nextStep set, when needsFollowUp() is called, then it is excluded regardless of interaction history"
  - "Given a contact created more recently than the configured grace period, when needsFollowUp() is called, then it is excluded even if it has a nextStep and no interactions"
  - "Given no settings row exists yet, when getFollowUpConfig() is called, then it returns and persists the quorum defaults (windowDays: 30, graceDays: 14)"
  - "Given PUT /api/settings/follow-up with a non-positive-integer value, then it returns 400 and does not persist"
  - "Given GET /api/contacts/needs-follow-up?withinDays=N&graceDays=N, then the query params override the persisted settings for that call only, without changing the stored default"

steps:
  - id: research
    description: Confirm current Store schema/migrate() structure and server.ts's existing route/validation patterns (MalformedJsonError, verdict-enum validation) before adding new ones
    agent: researcher
  - id: implement
    description: Add the settings table + get/set methods, real needsFollowUp() query (correlated-subquery or LEFT JOIN + MAX(at) GROUP BY, NULL-last-interaction sorts as oldest), and the two new server routes
    agent: developer
    depends_on: [research]
  - id: test
    description: Write and pass unit tests for needsFollowUp() (all acceptance criteria above) and settings get/set/lazy-seed, plus server route tests
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness, SQL query soundness, and convention compliance
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

