id: mtb-01-wire-mcp-tools
epic: mcp-tool-bodies
title: Wire the 5 rolodex_* MCP tool bodies to the real Store/GoogleSync
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Every rolodex_* MCP tool has a real, already-correct zod schema but a stub
  handler returning "not implemented yet" text. Every Store/GoogleSync method
  these tools need is already implemented and tested (upsert, get, search,
  needsFollowUp, logInteraction, GoogleSync.pull, and the local-fields-
  preserving merge helpers). This story wires the handlers to real logic —
  the last unimplemented surface in the project.

  Response format: JSON-stringified data (agents consume these
  programmatically, not humans reading prose). Errors surface via the MCP
  SDK's isError:true flag from a per-handler try/catch, not an uncaught
  throw that would crash the whole stdio process. rolodex_sync_google's
  push direction returns a clear, structured not-implemented response
  (push() itself stays a stub, out of scope project-wide) rather than
  crashing or silently no-op-ing.

acceptance_criteria:
  - "Given rolodex_upsert with a name, when called, then it persists via Store.upsert() and returns the saved contact as JSON"
  - "Given rolodex_search with a query, when called, then it returns real Store.search() results as JSON"
  - "Given rolodex_followups, when called, then it returns real Store.needsFollowUp() results as JSON"
  - "Given rolodex_log_interaction with a contactId and note, when called, then it persists via Store.logInteraction() and returns the created interaction as JSON"
  - "Given rolodex_sync_google with direction=pull or both, when called, then it calls GoogleSync.pull() and routes results through the existing applyPullToStore/mergeLocalOnlyFields helpers, preserving local-only fields exactly as the shell's Sync now button does"
  - "Given rolodex_sync_google with direction=push, when called, then it returns a clear, structured not-implemented response, not a crash or silent no-op"
  - "Given any handler's underlying Store/GoogleSync call throws, when that happens, then the tool returns { content, isError: true } instead of crashing the stdio server process"

steps:
  - id: research
    description: Confirm the exact current stub bodies and zod schemas in src/mcp/server.ts, and the exported signatures of Store/GoogleSync methods being wired
    agent: researcher
  - id: implement
    description: Replace all 5 stub handler bodies with real calls to Store/GoogleSync methods, JSON-stringified responses, per-handler try/catch with isError:true on failure
    agent: developer
    depends_on: [research]
  - id: test
    description: Write and pass unit tests per tool (call handlers directly against a real temp-file Store, no mocks, following src/shell/server.test.ts's pattern) plus one real end-to-end smoke test via the MCP SDK's stdio client against a scratch ROLODEX_DB
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness, error-handling completeness (all 5 handlers), and convention compliance
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

