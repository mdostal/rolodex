  - title: Current stub to replace (one of five, same shape for the rest)
    file: src/mcp/server.ts
    snippet: |
      server.tool(
        "rolodex_upsert",
        "Add or update a contact (partner/network). Provide any known fields.",
        { id: z.string().optional(), name: z.string(), /* ...rest of real schema... */ },
        async (args) => {
          // TODO(build): normalize -> store.upsert; return the saved contact id.
          void store;
          return { content: [{ type: "text", text: `upsert not implemented yet: ${args.name}` }] };
        },
      );
  - title: Reusable local-fields-preserving merge (already exported, do not reimplement)
    file: src/lib/google-sync.ts
    snippet: |
      export function applyPullToStore(pulled: Contact[], store: UpsertableStore): ApplyPullSummary {
        for (const contact of pulled) {
          const existing = findExistingMatch(contact, store.list());
          const merged = mergeLocalOnlyFields(contact, existing);
          store.upsert(merged);
        }
        // ...
      }
  - title: MCP SDK error-response shape to use on any thrown error
    file: node_modules/@modelcontextprotocol/sdk/dist/esm/types.d.ts
    snippet: |
      // CallToolResult carries an optional isError: boolean field.
      // On failure: { content: [{ type: "text", text: <error message> }], isError: true }

design_decisions:
  - decision: "Response format is JSON-stringified data, not human-prose summaries"
    rationale: "These tools exist for an agent to parse and act on programmatically — matches the north star framing ('let your AI agents read, search, and update')."
  - decision: "rolodex_sync_google's push direction returns a structured not-implemented response rather than crashing or silently doing nothing"
    rationale: "The tool's existing zod schema already commits to a 3-way direction enum including push; the schema shouldn't silently lie about a capability that doesn't exist."
  - decision: "Every handler gets its own try/catch returning isError:true on failure"
    rationale: "An uncaught throw inside one MCP tool handler would crash the whole stdio server process, taking down all 5 tools for whatever host is connected — confirmed via the SDK's isError field as the correct mechanism, not custom error plumbing."

risks:
  - severity: low
    description: Response-shape ergonomics (what exactly to JSON.stringify per tool) rather than logic risk, since all underlying methods are already tested
    mitigation: "Acceptance criteria above are explicit per-tool about what gets returned"

