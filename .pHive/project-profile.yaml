north_star:
  goal: >
    Ship a standalone desktop app — own UI, own install/setup wizard, own login —
    for running a personal rolodex: full contact management, Google Contacts as
    the initial login/sync method, with room to add other systems later. The
    MCP/Pantheon tool surface is a secondary integration layer that plugs in
    after the standalone app exists, not the primary architecture.
  audience: >
    A single user per install/deploy. Each person pulls down and runs their own
    separate installation against their own data, gated behind login. It could
    run online as part of a larger deploy, but remains single-user-per-instance
    even then.
  expected_scale: >
    Single user per rolodex instance — not multi-tenant. No concurrent-user
    scaling concern; the scale axis that matters is contact/interaction volume
    for one person, not simultaneous users.
  pain_points: >
    Poor personal follow-up discipline — losing track of who to reach back out
    to and when. Difficulty knowing which niche/specialty a contact belongs to
    unless working with them day-to-day (today that context mostly lives in
    company Slack, not anywhere durable).
  success: >
    A tool that runs the full rolodex of clients/contacts, integrates with
    Google Contacts as the current login/interaction method with room to expand
    to other systems, and walks through setup via an install wizard (including
    logins). Per contact: store info, log how calls went, track contact
    timeframes, surface when to reach back out, and capture who to partner
    with / their niche.
  avoid: >
    Building this as a pure CLI-first tool, or letting the Pantheon/MCP plugin
    integration become the primary architectural focus before the standalone
    UI app is built out. The plugin surface comes after, not instead of.
